featureEyebrow: Featured work
featureTitle: 'Requiem: Ceaseless Life'
featureSummary: >-
  Charlotte's senior honors thesis at Amherst College: an eight-movement
  Requiem for soloist, SATB choir, and reduced orchestra. Libretto by Haoran
  Tong.
featureLinkLabel: Explore the Requiem
detailEyebrow: Composition
detailIntroduction: >-
  An eight-movement Requiem for soloist, SATB choir, and reduced orchestra,
  composed as Charlotte's senior honors thesis at Amherst College.
aboutHeading: About the work
aboutBody: >-
  Requiem: Ceaseless Life brings together Charlotte's interests in composition,
  text, voice, and ensemble storytelling. This page can grow into a fuller
  archive of the work, including its background, performance history, and
  related materials.
