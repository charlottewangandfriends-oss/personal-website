  program can be added from the editor.
programButtonLabel: Download concert program
collaborationHeading: And what?
collaborationBody: >-
  Interested in performing, programming, or developing Requiem: Ceaseless Life?
  Charlotte welcomes conversations with conductors, ensembles, singers, and
  creative collaborators.
