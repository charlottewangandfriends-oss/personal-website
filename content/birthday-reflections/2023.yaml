bodyZh: |-
  夏洛特，二十三岁生日快乐！

  很难不赞同大清清说的话——二十岁之后，生日就没有感觉了，只是通向人生尽头的一小笔。仔细想想，人生已经过了四分之一了，就觉得真可怕；想象着这个分数在不经意间会忽然变成三分之一、二分之一，就觉得更可怕。

  当然，这是在可以安安稳稳活到老的前提下。这几年学会的一个课题就是向死而生。Composition Thesis，写着给自己的Requiem，有了一点莫扎特附身的感觉，仿佛马上就要留下半步红楼了。作曲课上也很认真地嘱咐过后事，倘若不能在生年完成这部作品，就拜托教授和同窗们完成。不过，我当然还是希望能够自己完成并见证它的首演的。等它在我的葬礼上响起，希望是很多很多年以后了——也许那个时候我已经有更好的Requiem了。

  从十七岁生日到现在，写了五年的小作文，无一例外是用第二人称。但是今年，第一人称很自然地就流露出来了。可能这也是一个自我意识膨胀，i.e. ego越来越大的标志吧。其实我从小就是一个喜欢在自己的世界里乱蹦跶的人，但是现在不一样的是，我不会再以此为耻了。我的文风也不一样了；曾经大段大段的如诗如画的文字，如今是写不出来了。现在的我已经离诗意有一点远了，想起这一点，我有时会有点失落——也许这是成长的必经之路吧。我现在的文艺不再是风花雪月了；是有自己的形状和方向的文艺，是略带一些疯魔的文艺。

  翻了翻去年的小作文，那时候还在思考自己要什么，而今年大概已经有了答案。思及此，便更觉得人生像极了修真小说，追求的不过一个道；求道之路，不过是一个在不断顿悟中修补、更新所立之道的过程。

  而在这个过程中，平静地失去，优雅地告别，从容地等待往后的也许并不存在的缘。嗯……我必须放下中提琴了，有点遗憾。但是几年前，我又哪能想到，我会有自己在琴上拉出Le Dernier Matin的一天呢？

  我的二十二岁，是习惯、拥抱、并捍卫迷茫，是把挂念放在心里而不打扰，是对我的欠的因果说出“不后悔”。是面对许许多多的无疾而终，无悔于开始，无怨于结束。

  我说，我是要成长一辈子的人。有人陪我走过所有的路，是我的幸运。我会抓着他的手，一直到抓不住的那一天。但是，如今，我也有孤身走过岁月的勇气了。

  “归去，也无风雨也无晴” ——我二十三岁的时候，终于明白了（又或者……我明白了吗？）
