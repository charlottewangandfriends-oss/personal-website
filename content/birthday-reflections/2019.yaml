year: "2019"
date: "2019-11-27"
bodyZh: |-
  你曾经戏言，十八岁之前每一年都是长大，之后每一年就叫做变老。

  如今便是你第一次正式变老。

  2019年11月27日，舒尧·夏洛·特·机智·可爱·王十九岁生日快乐。

  十八岁这一年是从孩子一下子哗啦啦长成大人的一年。在最后幸福地做了一会儿孩子之后，一切转变的那样突然，所有的欢声笑语忽然就落幕了，你忽然就失掉了做孩子的权利，然后你发现一件更可怕的事情：你居然可以渐渐习惯做大人了。

  你曾那样虔诚地做过一个孩子，你一股脑儿地往前硬冲，也曾经放下豪言壮语，觉得天下大概没有你努力而做不到的事。不过十八岁不仅给了你一个巴掌，还把你吊起来打了一顿。你以为你可以和他一样，在这一年站在他站过的地方念他念过的诗。英语课上的票选结果出来之后，整个世界仿佛都是荒诞的。你不明白，为什么大家可以对这一切毫不在乎，哪怕他们的毫不在乎毁掉了你在乎的东西。你曾经那么想得到那个角色，但你终究只能眼睁睁地看着它从你的指尖略过去。“生不逢时”也许是最好的答案——可是，纵然碰上了不好的时代，你的最好的花季，也只有这一次。你流过泪，写过信，和老师谈过心，你知道你没有任何后悔的理由了，可是你还是那样地无力。五月的时候，哪怕你一遍遍告诉自己你不在意，你依旧面对着命运的阴错阳差无所适从。你怀疑过自己，怀疑过努力，也怀疑过世界，也曾在新的起点前害怕过，胆怯过。但你大概应该为自己骄傲吧，走过这些路之后，你终究还是选择相信努力。

  也是在十八岁，在枯井里困了三年也喊了三年的你终于等到了回音。你和抑郁症斗争了三年，也为那一点点救赎斗争了三年。你知道你不容易，在这三年里坚持着不忘掉自己不容易，在这三年里努力保持成绩不容易，在这三年里不被丢出去不容易，在这三年里努力生活更不容易。好在这一切都算结束了。如今，你偶尔还是有那样灰色的小日子，可是你已经可以从容地闭上眼睛，因为你知道天会晴。而天晴的日子里，你也永远不会忘记，你触手可及的这一切，看似平平常常的这一切，是你曾经心心念念而不可得的。你终于可以这样放肆地热爱生活里。带着对生活的热爱向前冲，而再也没有什么能把你打倒了。

  然后，你又要在提起那个十七岁的时候提到过的人，那个你问“十七岁的我们和十八岁的我们是同一个我们吗”的时候摇头的男孩子。在十七岁里失去他之后，哪怕如故地爱着，你也不曾期许过还能牵起他的手。那个三月显得那样不真实，就像那天晚上从窗外掠过的霓虹灯光一样。最后的那个春天和夏天，过的很平静，很安宁，好像注定要让什么看起来圆满一些一样。你曾盼着和他一起坐过山车，在三月的佛罗里达实现了。你曾盼着和他一起走在查塔努加的小路上，在四月实现了。你曾盼望着和他一起去看点儿音乐的东西，最后你们一起看了歌剧《卡门》。你曾盼望着简简单单地和他过周末，而这一切也成真了。那个最艰难的春天里，有着你和他最好的时光。七月的西海岸的阳光，你总是记得，因为你也是在这样的晚上七点的阳光里，对着他的视频，写完你的十页论文。那时候，岁月静好，一切的美都仿佛看不到头。可是，一切结束的又那么突然，或者说它根本连一个结尾也没有，就不再有未来了。后来你也看不清了，后来你也妥协了，后来你终于敢把一切真正地交付到命运的手里了。虽然你到现在也不曾明白，你放走的到底有什么，你留在心里的又到底是什么。但是你的十九岁大概不会有他了，而他的十九岁也不会有你了。

  你的十八岁真是充满了失去，亦或者是——反反复复的得到和失去。不仅仅是那个人而已。终于等到和解，却是在毕业前不剩几天的玛姬。让你找到了久违的家的感觉，给了你很多温暖，却也令你心如刀割地推门离开的奶茶之爱的家。说好一起告别过去，说着“夏夏不要走”却自己先离开的汤汤。你以为可以互相照顾着走过这一年，一切却在十一月戛然而止的艾丽卡。五月末送走的那一波小伙伴。六月里献上祝福，心知往后再不能在圣诞相见的那些老同学。然后你发现也许孤独才是你的归宿。

  小刘老师曾经问你，如果你可以选择重来，对于那些你得到了又失去了、疼的刻骨铭心的事情，你会选择再不要经历，还是会义无反顾地再走一遍。你说：“自然是一定要再走一遍的。”所以你也学着感恩自己曾经拥有过的东西。而且，你也不得不承认，这一年你也收获了许多新的东西。你新学会了一二三四五六门乐器，还不算三角铁。你新学着两门语言。你跑去给九年级小朋友当妈，却在山清水秀的地方做了一回孩子。你开始试着给合唱团和管乐团同时当妈。你开始在下午散步。你开始做饭。一切都正正好。

  这一年正是将暮未暮的时候。故事已经结束，而结局尚未来临。等待的时光因为期待而变的无比漫长，因为空白而显得无比孤独。有时候每一分每一秒，似乎你都能感受到呼吸的一张一弛一样。但是这不应该也是你最好的时候吗——你游走在夹缝中，也在自由的空间里。披着红色的上衣，天好像很高很高，地平线很像很远很远，你可以大口大口地吸气，也可以高声地放歌。

  现在你要十九岁。愿你在十九岁，在这个崭新的起点，在这故事交替的最后一点空隙里，一如既往地往前冲，一如既往地遍体鳞伤，一如既往地原地复活。趁着，嗯，其实你还年轻。

  最后，以All-East一首歌的歌词作结：

  When I come to the end of the road, and I lay down my heavy load, let the life I've lived speak for me.
bodyEn: |-
  You once joked that every year before eighteen counts as “growing up,” and every year after eighteen is called “getting old.”
  And now, this is your first official step into getting old.

  November 27, 2019 — Happy nineteenth birthday, Shuyao · Char · Lot · Wise · Cute · Wang.

  Eighteen was the year you rushed, all at once, from a child into an adult. After the brief joy of being a child one last time, everything shifted so abruptly—every laugh and every moment of innocence suddenly dropped its curtain. You suddenly lost the right to be a child, and then you discovered something even more frightening: you were beginning—bit by bit—to grow used to being an adult.

  Once, you had cleaved so devoutly to childhood. You hurled yourself forward with everything you had; you once boasted loudly, believing there was nothing in the world that hard work could not win for you. But eighteen not only slapped you—it strung you up and beat you.
  You thought you could be like him, standing where he once stood, reciting the poem he once read. But when the results of that vote came out in English class, the whole world seemed absurd. You could not understand how everyone could be so indifferent—how their indifference could destroy something you cared about so deeply.
  You had wanted that role in the musical so badly, but in the end you could only watch it slip away between your fingers. “Born at the wrong time” might be the best explanation—yet even if the era failed you, your brightest springtime comes only once.
  You cried, you wrote letters, you spoke with your teacher; you knew you had no reason for regret, and yet the helplessness still crushed you.
  By May, even though you told yourself again and again that you didn’t care, you still found yourself lost before the cruel accidents of fate. You doubted yourself, doubted effort itself, doubted the world; you trembled at new beginnings, turned cowardly at new thresholds. But perhaps you should be proud—after walking so far, you still chose to believe in trying.

  It was also at eighteen—after three years of shouting into a dry well—that you finally heard an echo.
  You battled depression for three years; you fought for that tiny bit of redemption for three years.
  You know it wasn’t easy—enduring without forgetting it wasn’t easy, keeping your grades through those years wasn’t easy, not being discarded wasn’t easy, and living—living was the hardest of all.
  But now, all of that is more or less over. You still have gray days, but now you can close your eyes with composure, knowing the sky will clear. And on the clear days, you will never forget that everything within your reach now—everything that looks so ordinary—was once something you longed for but could not obtain.
  Now, you are finally able to love life with abandon. You rush forward with that love for living—and nothing can defeat you anymore.

  And now—you must bring up the boy you mentioned when you were seventeen, the one who shook his head when you asked, “Is our seventeen-year-old self the same as our eighteen-year-old self?”
  After losing him at seventeen, even though you loved as always, you never expected you could hold his hand again.
  That March felt unreal—like the neon lights passing the bus window that night.
  That final spring and summer passed peacefully, quietly, as if something were destined to look complete again.
  You once wished to ride a roller coaster with him; it happened in March, in Florida.
  You once wished to walk the little roads of Chattanooga with him; it happened in April.
  You once wished to go see something musical together; in the end you watched Carmen.
  You once wished simply to spend a weekend with him—and that, too, came true.
  In that most difficult spring, the best time you had was with him.
  You always remember the sunshine of the West Coast in July—because it was under a seven-o’clock sky like that, facing his video call, that you finished your ten-page paper.
  Back then, all was gentle and good, and the beauty of the days seemed endless.
  But it all ended so suddenly—or rather, it ended without an ending at all, and there was no future left.
  Later, you couldn’t see clearly anymore; later, you compromised; later, you finally dared to place everything truly in the hands of fate.
  Even now, you still do not know exactly what you let go of, nor what you kept in your heart.
  But your nineteenth year will likely not have him—and his nineteenth will not have you.

  Your eighteenth year was truly filled with loss—or perhaps, repeated cycles of gaining and losing.
  And not only because of him.
  The long-awaited reconciliation that came with Maggie—only days before graduation.
  The family-like group that gave you warmth and the feeling of home—yet stabbed you painfully when you had to push the door open and leave.
  Tom, who said “Let’s leave the past behind together,” and “Char, don’t go”—but left first.
  Erica, with whom you thought you would survive the year, only for everything to end abruptly in November.
  The friends you sent off at the end of May.
  The graduating old classmates you blessed in June, knowing you would never meet again when you return home in future Christmas.
  And then you realized—perhaps loneliness is your true resting place.

  Miss Lau once asked you: if you could relive life, for those things you gained and then lost, the ones that hurt to the bone, would you choose never to experience them again, or would you walk through them once more without hesitation?
  You said: “Of course I would walk through them again.”
  So you learned to give thanks for what you once had.
  And you must admit—you also gained many new things this year.
  You learned one, two, three, four, five, six new instruments—not counting triangle.
  You learned two new languages.
  You became “mom” to the ninth graders—yet in the mountains and clear waters, you were a child again.
  You tried being “mom” to both choir and band kids at once.
  You started taking afternoon walks.
  You started cooking.
  Everything was just right.

  This year is that moment between dusk and night—neither quite ending nor quite beginning.
  The story is over, but the ending has not yet arrived.
  The waiting grows unbearably long because of hope, unbearably lonely because of blank space.
  Sometimes, in every minute and every second, you can feel your breath tighten and release.
  But isn’t this also your best moment?—
  You wander between narrow cracks, yet stand in open freedom.
  As you put on your red blazer, the sky feels impossibly high, the horizon impossibly far; you can inhale deeply, and you can sing loudly.

  Now you are about to turn nineteen.
  May you, at nineteen, at this brand-new beginning, in this last sliver of space where stories change hands—
  rush forward as always,
  be bruised all over as always,
  and rise from the ground as always.
  While—well—you are still young, after all.

  Finally, let me end with a song from All-East:

  “When I come to the end of the road,
  and I lay down my heavy load,
  let the life I’ve lived speak for me.”
