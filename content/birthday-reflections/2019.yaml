year: '2019'
date: '2019-11-27'
bodyZh: |-
  你曾经戏言，十八岁之前每一年都是长大，之后每一年就叫做变老。

  如今便是你第一次正式变老。

  2019年11月27日，舒尧·夏洛·特·机智·可爱·王十九岁生日快乐。

  十八岁这一年是从孩子一下子哗啦啦长成大人的一年。在最后幸福地做了一会儿孩子之后，一切转变的那样突然，所有的欢声笑语忽然就落幕了，你忽然就失掉了做孩子的权利，然后你发现一件更可怕的事情：你居然可以渐渐习惯做大人了。

  你曾那样虔诚地做过一个孩子，你一股脑儿地往前硬冲，也曾经放下豪言壮语，觉得天下大概没有你努力而做不到的事。不过十八岁不仅给了你一个巴掌，还把你吊起来打了一顿。你以为你可以和他一样，在这一年站在他站过的地方念他念过的诗。英语课上的票选结果出来之后，整个世界仿佛都是荒诞的。你不明白，为什么大家可以对这一切毫不在乎，哪怕他们的毫不在乎毁掉了你在乎的东西。你曾经那么想得到那个角色，但你终究只能眼睁睁地看着它从你的指尖略过去。“生不逢时”也许是最好的答案——可是，纵然碰上了不好的时代，你的最好的花季，也只有这一次。你流过泪，写过信，和老师谈过心，你知道你没有任何后悔的理由了，可是你还是那样地无力。五月的时候，哪怕你一遍遍告诉自己你不在意，你依旧面对着命运的阴错阳差无所适从。你怀疑过自己，怀疑过努力，也怀疑过世界，也曾在新的起点前害怕过，胆怯过。但你大概应该为自己骄傲吧，走过这些路之后，你终究还是选择相信努力。

  也是在十八岁，在枯井里困了三年也喊了三年的你终于等到了回音。你和抑郁症斗争了三年，也为那一点点救赎斗争了三年。你知道你不容易，在这三年里坚持着不忘掉自己不容易，在这三年里努力保持成绩不容易，在这三年里不被丢出去不容易，在这三年里努力生活更不容易。好在这一切都算结束了。如今，你偶尔还是有那样灰色的小日子，可是你已经可以从容地闭上眼睛，因为你知道天会晴。而天晴的日子里，你也永远不会忘记，你触手可及的这一切，看似平平常常的这一切，是你曾经心心念念而不可得的。你终于可以这样放肆地热爱生活里。带着对生活的热爱向前冲，而再也没有什么能把你打倒了。

  然后，你又要在提起那个十七岁的时候提到过的人，那个你问“十七岁的我们和十八岁的我们是同一个我们吗”的时候摇头的男孩子。在十七岁里失去他之后，哪怕如故地爱着，你也不曾期许过还能牵起他的手。那个三月显得那样不真实，就像那天晚上从窗外掠过的霓虹灯光一样。最后的那个春天和夏天，过的很平静，很安宁，好像注定要让什么看起来圆满一些一样。你曾盼着和他一起坐过山车，在三月的佛罗里达实现了。你曾盼着和他一起走在查塔努加的小路上，在四月实现了。你曾盼望着和他一起去看点儿音乐的东西，最后你们一起看了歌剧《卡门》。你曾盼望着简简单单地和他过周末，而这一切也成真了。那个最艰难的春天里，有着你和他最好的时光。七月的西海岸的阳光，你总是记得，因为你也是在这样的晚上七点的阳光里，对着他的视频，写完你的十页论文。那时候，岁月静好，一切的美都仿佛看不到头。可是，一切结束的又那么突然，或者说它根本连一个结尾也没有，就不再有未来了。后来你也看不清了，后来你也妥协了，后来你终于敢把一切真正地交付到命运的手里了。虽然你到现在也不曾明白，你放走的到底有什么，你留在心里的又到底是什么。但是你的十九岁大概不会有他了，而他的十九岁也不会有你了。

  你的十八岁真是充满了失去，亦或者是——反反复复的得到和失去。不仅仅是那个人而已。终于等到和解，却是在毕业前不剩几天的玛姬。让你找到了久违的家的感觉，给了你很多温暖，却也令你心如刀割地推门离开的奶茶之爱的家。说好一起告别过去，说着“夏夏不要走”却自己先离开的汤汤。你以为可以互相照顾着走过这一年，一切却在十一月戛然而止的艾丽卡。五月末送走的那一波小伙伴。六月里献上祝福，心知往后再不能在圣诞相见的那些老同学。然后你发现也许孤独才是你的归宿。

  小刘老师曾经问你，如果你可以选择重来，对于那些你得到了又失去了、疼的刻骨铭心的事情，你会选择再不要经历，还是会义无反顾地再走一遍。你说：“自然是一定要再走一遍的。”所以你也学着感恩自己曾经拥有过的东西。而且，你也不得不承认，这一年你也收获了许多新的东西。你新学会了一二三四五六门乐器，还不算三角铁。你新学着两门语言。你跑去给九年级小朋友当妈，却在山清水秀的地方做了一回孩子。你开始试着给合唱团和管乐团同时当妈。你开始在下午散步。你开始做饭。一切都正正好。

  这一年正是将暮未暮的时候。故事已经结束，而结局尚未来临。等待的时光因为期待而变的无比漫长，因为空白而显得无比孤独。有时候每一分每一秒，似乎你都能感受到呼吸的一张一弛一样。但是这不应该也是你最好的时候吗——你游走在夹缝中，也在自由的空间里。披着红色的上衣，天好像很高很高，地平线很像很远很远，你可以大口大口地吸气，也可以高声地放歌。

  现在你要十九岁。愿你在十九岁，在这个崭新的起点，在这故事交替的最后一点空隙里，一如既往地往前冲，一如既往地遍体鳞伤，一如既往地原地复活。趁着，嗯，其实你还年轻。

  最后，以All-East一首歌的歌词作结：

  When I come to the end of the road, and I lay down my heavy load, let the life I've lived speak for me.
