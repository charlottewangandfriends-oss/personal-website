year: '2020'
date: '2020-11-27'
bodyZh: |-
  Dear Charlotte, HBD.

  过去的一年里，你的十九岁是操着熟悉的船，在前所未见的风暴里，向陌生的海域驶去。

  十九岁，你渐渐是一个大人。你学会做别人的肩膀。曾经做小跟班的你成为孩子们的顶梁柱，来不及委屈、抹掉眼泪还要继续撑起来半片天空的那种。数年的身不由己之后，你终于渐渐可以掌控自己的人生。你有了第一场说走就走的旅行，从此一个人的旅行在长辈眼中也成为了常态。把时间花在自己想做的事上，选自己想选的课。你终于真正迈出了那一步，踏进了那道仰望已久的门。盘算着想学的专业，给各个系寄出一份份问询的邮件，计算着课的所需学分。焦虑也好，天真也罢，至少未来的蓝图里，终于有了你亲笔勾勒的底线。

  你做出了属于的选择。从此南湖的山水成为了过往，苍翠的岁月成为了你回不去的家。从此猛犸的紫色成为了你的骄傲，也给了你使命。这一年，过去的生活在你眼前撕裂。曾经的童话轰然倒塌，只留下现实冷漠的影子。在这样的一年，所有曾经沉默的背景板，都有了自己的角色。割舍不下的过去，必须看清的现在，从未停下脚步往前的未来，这是你的世界。四海为家而无枝可依，这是你的世界。

  这一年的底色是孤独。从十九岁的开始你就知道，你的十九岁，有一些命运下纠缠的影子不会再有了。二十岁也不会有了。情绪言语在时光里风化，在思绪的长河中模糊。只有在梦中才能见到那个影子，也只有在梦中才能众里寻他千百度而泪流满面。你在空白的缝隙中试图寻找新生，也曾与许多身影几度擦肩而过。欣喜有之，虔诚有之，珍惜有之，期许有之。但也是在这种分杂中，你明白了，一个人的人生，只会是一个人的人生。

  十九岁是太多来不及说的再见。你爱了两年的孩子们，没能收到的花，和没能听到的他们唱的你为他们写的歌。没能披上的红袍和没能穿上的小白裙，还有想好了却来不及落笔的感谢信。等了三年的旅行，熬成主角的舞会，修修改改了好多遍的毕业演讲稿，都成了纷乱世界里的无疾而终；恍若一生的三年过往，家一样的山和水和人，还有一直慢慢变淡的影子，还没等到最后一个拥抱，就忽然永远地失去了。

  十九岁的空白里也有很多的久别重逢。撑过了大半个春天的自习室小组；一起约过的奈雪和KOI和喜茶。十九岁最后的日子里，五道口寒气沁人的空气，灯光下呼出的迷离的白雾，在暮色里失去颜色的围巾，然后你知道，很多事情变了，很多没有；很多长大了。

  二十岁，人生扬起新帆，驶向不知处不知名的远方。风雨啸啸，路也遥遥，只是你已是真正的掌舵人。二十岁，人生进度条已经走了四分之一——或五分之一，但你确还年轻，足够学好多东西，做成好多事，走出很远。愿你的二十岁依然善良，依然热爱生活，依然拥抱世界。

  生日快乐。
