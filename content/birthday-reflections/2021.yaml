year: '2021'
date: '2021-11-27'
bodyZh: |-
  21☘️

  过零点的时候，我正在science center，从二十岁的学习人变成二十一岁的学习人。

  过去的二十岁是崭新的起点。在新英格兰的漫天大雪里，南方的山水成为了过往，一望无际的白色也埋葬了长久的执念。像这个世界一样，从停摆的缝隙中走出，告别不可能回去的过往，开始新的生活。新的地图，新的友人，新的故事。在新的纬度里，你尝试着一点一点变成新的人。思想的成长是回环往复的拉扯；你思考正义，然后看到正义背后的不正义。你思考和平，然后看到和平背后的不和平。你用曾经不理解、现在也不认同的方式创作戏剧，用大半年的时间完成一个不曾接触也不会再驻足的领域的研究。也许人生，就是在世间万物里做一个留下痕迹的过客。

  出生以来的第一个不单身的生日，自是难以忽略。并非不曾遗憾过自己再也不可能拥有十七岁的青涩而炙热的爱情了，因为再也不可能十七岁了；但渐渐你觉得，二十岁的爱情也不错。看得见未来的爱情，好像有着绵长的生命力，给了迷路的勇气一个家。向着未来走的每一步，不再是在风中燃烧，而是在水中铺路，让人安心。从四个月的异国，到朝夕相处的假期，再到守望的秋季；从厨房的炊烟和亲手组装的电风扇，到满载的行囊与颠簸的火车。学着去爱和被爱，依靠和被依靠，展现脆弱与发现脆弱。也许，这才是爱情最本来的面目吧——“爱情，是一起生活。”

  二十岁，成长了三年的梦想终于有了土壤。你终于找到了选择自己的未来的力量，并学会为之负责。那些一点一点攒下的工资，那些不计学分也要付出的努力，那些躺在床上时睁眼闭眼都能看到的压力，应该都是美丽的吧。你站在足够的高度，终于看清了的梦想的标价，不出意外地昂贵，但过去的三年，你的努力至少赢得了为梦想奋斗的勇气和权利。你是幸运的，身边站满了支持你的人；但你也知道，纵然站的是不支持的人，也打不倒你了。

  有时感觉自己的灵魂永远十七岁，但也清楚自己确实开始变老。渐渐变短的生日小作文，可能也是衰老的一部分吧。“奔三”的感觉，二十一岁远比二十岁更深刻。

  王小波在《黄金时代》中写道，“那一天我二十一岁，在我一生的黄金时代。我有好多奢望。我想爱，想吃，还想在一瞬间变成天上半明半暗的云。后来我才知道，生活就是个缓慢受锤的过程，人一天天老下去，奢望也一天天消失，最后变得像挨了锤的牛一样。可是我过二十一岁生日时没有预见到这一点。我觉得自己会永远生猛下去，什么也锤不了我。”但也许是时代的不同吧，现在的二十一岁好像已经不是这样，除了脚踏实地地把日子过好之外，好像也没什么别的奢求。只是也没有人知道，以后会不会更糟。

  但是现在，至少你拥有被锤的觉悟与勇气。愿你的二十一岁不要把他们遗失掉。
