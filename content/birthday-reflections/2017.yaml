year: "2017"
date: "2017-11-27"
sourceDate: "2017-11-26"
bodyZh: |-
  今天你十七岁了。

  十四岁的今天你波澜不惊地来到学校，十五岁的今天你早早坐上合唱比赛的车，十六岁的今天你匆匆茫茫兴致勃勃地赶去秋游，如今你十七，一个人独自拎着大包小包在机场穿梭着。

  好像很不一样了。

  夹缝中的一年就那样过去了；怎么想也觉得不可置信。

  曾经你以为十五岁已是低谷，回首发现那时候最大的挫折是考试进不了年段前十，最大的感伤是身体偶尔的不如意，最大的孤独是下课没有人陪走堂。后来你走完了十六岁，发现曾经的悲伤皆是风花一样年纪里风花一样的过往，然后感叹一句，人果然是要走过足够的路站的足够高才能足够宽大足够淡然。

  曾经你不知道什么叫努力，直到你自以为的骄傲在每一次失望的更加麻木中消耗殆尽。看不见尽头的扭曲的个人世界，被压缩到极致的时间教的凌乱的生活，永远爬不上的那级近在眼前的台阶……一个人从陌生城市的自行车上撑不住跌下的那一刻，你也觉得苦涩；只是回头看去，所有感受好像云一样灰飞烟灭了。

  十五岁时掠过的一抹阳光成为十六岁不能抓住的一场残梦。无数次跨过中庭奔向大楼梯时耳边呼呼的风，无数次倚靠着恪勤二楼护栏时栏杆的温度，无数次转角处自知而不能抑制的笑容，后来所有的为什么终于都等到了答案，魔法倏然消失了。抱着尤克里里从二楼下来，你也难过的，然而你知道了，你的人生中再也不会有“执念”二字了。

  也许是你十六岁最重要的两件事了。曾经觉得是苦咖啡，如今搅了搅，没有所谓回甘，也不再有当初的味，确是云淡风轻了。

  十六岁是多余的。好像是十三四五岁里挤出来的残渣，又榨干了给十七八九岁做准备。然而你说，这是最好的你。

  这一年你和最好的班级在一起，你第一次看足球赛，在操场上高举着牌子喊到嘶哑。你和最好的小组在一起，被人笑为一家四口，表面不置可否，心中乐哉乐哉。你有一个最好的同桌，那个亲生兄长一样的人，很久以后，终于等到一句“谢谢你陪我长大”，那一刻身在异乡，你依旧潸然泪下。

  这一年你也做了你过去和未来不敢做的事情；呕心沥血地挑战高一音广历史，铩羽而归后在语文课上哭到抽搐的是你，拼着写下排下班歌，穿着黑裙子站在人群最前镁光灯下，最后拿着奖状直接在台上不能自制地哭花妆容的是你。你终于把心血搬上了荧幕，虽说依旧心知上不得台面，却也感慨回过头来竟然走了这么长的路。

  最后的夏天你和爱的每一个人道别。在那座大楼安静的夕阳光里，你也迷醉过欢喜过；梦醒来的时候恍惚了许久，却庆幸的发现该在的一直没有失落过。最后你还到那个古老的城市去，算为母校和故乡做一点最后微薄的事，本没什么期望，却被告知创造了历史，倒也叫人惊喜；这时你的夏天已经要结束了，留一个背影消失不见，倒也怡然自得。

  你知道十三岁站在领奖台上的锋芒毕露窥见天光时候你找不回来了，你知道十四岁时风华正茂意气风发的你也找不回来了，甚至那个十五岁时风花雪月伤春悲秋的你，好像也消失在岁月之中。但是十六岁的你，过了竹杖芒鞋轻胜马的年纪，回首时云淡风轻，好像也很美丽。

  十六岁之前你仿佛能窥见命运的轨迹，旁人作决定未来大事的中考，对你也不过睁眼闭眼的事。十六岁最后的日子你来到大洋彼岸，一个几个月前也不能料见的地方。

  你成为了夏洛特，终于走到地球另一头的世界里窥见它的模样。你在傍晚倚在田纳西河畔的躺椅上听鸟啭蝉鸣风声，看日落波纹山色；你坐在AP Chem的教室里听着曾经老师说的文科生不用接触也接触不到的泡利不相容原则；你遇见各种各样不同的圈子不同的人；你站在舞台中央披着黑发在许许多多人面前指挥一只真正的合唱团；你全副武装地握着剑在体育馆中位移；你一个人走过许许多多的路……这些，曾经的你从不曾想见过。还有那个你十七岁前夕走近的人，摇晃的歌声，躲雨的屋檐……回过头来相见恨晚，你也从来预料过。有一些你到十七岁也不愿醒来的梦，这算一桩。虽然还是醒了，幸有回甘。

  那天是2016年11月27日，清晨很大的雨偷走了秋游。下午的时候，却天气晴好，不见一点痕迹。那时你笑着说道，希望十六岁也像这天一般，雨过天晴。最终确是如此了。你看，你的十六岁真的很不错。最不该存在的岁月里，你的灵魂飞快地跌跌撞撞地长起来。

  你依旧张扬，可是什么时候爱好风头喜欢凑热闹的你，也爱上了独处时的潇洒淡然形单影只？你依旧不缺野心，可是什么时候争强好胜受不得一点挫折的你，也学会了看淡、放手、一笑置之？你依旧多情，可是什么时候总是恨不得把火一样的心掏出来给人看的你，也学会了静默地品味当下的情思、静静等待梦醒？

  现在你十七，成年前的最后一年，阳光一样最好的年纪，多一分太熟，少一分太涩。你有梦想，也没有梦想；你站在新的起点上，看不见尽头的未来在你的眼前铺展开来。

  请你十七岁一定要做一个很好的人；足够宽大足够慈悲，足够光风霁月，足够襟怀洒落。愿你笑颜常开不败；愿你浅斟低唱时有知己一二；愿你在最孤独的路上攀升。愿你“一蓑烟雨任平生”，亦愿你“也无风雨也无晴。”

  愿你变得更好，但也愿你做一个风一样的人；入目不是成堆的功课，是山色连绵湖光潋滟，是阳光正好白云悠悠。走愿走的路，行爱行的事，爱想爱的人。

  愿你十七岁的天空，无怨无悔。 （身在异乡，也愿这些你为之俯仰的文字，永远留在你的血液之中。）
bodyEn: |-
  Today, you are seventeen.

  On this day at fourteen, you came to school with quiet calm;
  on this day at fifteen, you boarded the bus for the choir competition early in the morning;
  on this day at sixteen, you hurried off to the autumn outing—rushed, dazed, but full of excitement.
  And now, at seventeen, you are shuttling through an airport alone, carrying bags big and small.

  It all feels so different.

  That year trapped between two eras slipped away just like that; no matter how you think about it, it still feels unbelievable.

  Once, you thought fifteen was already your rock bottom. Looking back, you realize that at that time your greatest setback was failing to place in the top ten of your grade; your greatest sadness was the occasional stubborn discomfort of your own health; your greatest loneliness was having no one to walk with you after class. Later, after living through sixteen, you found that all the former sorrows were nothing more than the fleeting blossoms of youth—beautiful, brief, and weightless. And you sighed, realizing that only after walking far enough, standing high enough, can a person have a big and calm enough heart.

  Once, you did not understand what “effort” really meant—until the pride you believed you possessed was gradually worn away by disappointment after disappointment, until numbness set in. A twisted inner world with no end in sight, a life thrown into disarray by time compressed to its limit, the step always just out of reach no matter how close it seemed… In the moment you slipped helplessly from a bicycle in that unfamiliar city, you, too, tasted bitterness. Yet looking back, all those feelings scattered like clouds and vanished.

  A streak of sunlight that brushed past you at fifteen turned into a shattered dream you couldn’t hold onto at sixteen. The rushing wind in your ears as you crossed the campus yard toward the grand staircase time after time, the warmth of the railing under your hands after leaning by the second floor of Keqin Building, the countless smiles you could neither hide nor restrain at the corner of the corridor—later, all the “why”s finally met their answers, and the magic disappeared in an instant. Carrying your ukulele down from the second floor, you were sad, too—but you knew then that the word “attachment” would never again appear in your life.

  Perhaps those were the two most important things in your sixteenth year. What once felt like bitter coffee—now stirred—has neither aftertaste nor its original flavor. It has thinned, dispersed, and drifted gently away.

  Sixteen seemed excessive. It felt like the residue squeezed out from thirteen, fourteen, fifteen, and then wrung dry again to prepare for seventeen, eighteen, nineteen. Yet you say that this was the best version of you.

  This year, you were with the best class—you watched your first soccer match and shouted yourself hoarse at the field with a sign held high. You were with the best group—mocked as a “family of four,” and though you pretended not to mind, you were secretly delighted. You had the best deskmate, someone like an elder brother. Much later, when you finally heard from him the words “Thank you for growing up with me,” far away in a foreign land, you still couldn’t hold back your tears.

  This year, you also did things you would never have dared to do in the past or the future. You poured your heart into competing in the Grade 10 Arts & Radio–History contest; after failing, it was you who sobbed uncontrollably in Chinese class. It was you who pushed through to compose the class song, who stood at the podium in a black dress under the spotlight, and who ended up crying your makeup off onstage with the award certificate in your hand. You finally brought your work to the screen; though you knew it still wasn’t good enough, you marveled at how long a road you had traveled.

  In the final summer, you said goodbye to everyone you loved. In the quiet sunset light of that building, you had been intoxicated, joyful; when you woke from the dream, you were dazed for a long time, yet relieved to find that what was meant to remain had never truly been lost. In the end, you went to that ancient city, doing one small, final thing for your alma mater and hometown. You had expected nothing, yet were told you had made history—and that surprise delighted you. By then, your summer was ending; you left behind only a disappearing silhouette, calm and content.

  You know that the brilliance you showed on the award podium at thirteen -- as if you could catch a glimpse of heaven’s light -- will never return. You know that the radiance and bold spirit you possessed at fourteen will not return either. Even the wistful, sentimental fifteen-year-old version of you seems to have vanished into time. But you at sixteen— though past the age when you could “feel lighter than on a horse with a bamboo staff and straw sandals (Su Shi), ”—looking back with clouds dispersed and sky clear, were beautiful too.

  Before sixteen, you felt you could glimpse the trajectory of fate; even the high school entrance exam, a life-changing matter for others, seemed to you merely a matter of blinking your eyes. In the final days of being sixteen, you crossed the ocean and arrived in a place you couldn’t have imagined months earlier.

  You became Charlotte. You finally arrived at the other side of the world and glimpsed its form. You lay back in a chair by the Tennessee River at dusk, listening to birdsong, cicadas, and wind, watching the sunset ripple across the mountains. You sat in an AP Chem classroom learning Pauli’s exclusion principle—the very thing your former teacher said a humanities student would never encounter. You met people from circles utterly unlike your own. You stood on a stage, black hair falling behind you, conducting a real choir before a great many people. You held a foil or epee and moved across the gym with full concentration. You walked many, many roads alone… These were things the former you could have never imagined. And then there was the person you met on the eve of turning seventeen—the trembling singing voice, the eaves where you hid from the rain… An unexpectable encounter, yet you still felt too meeting late. There are dreams you still would not want to wake from even at seventeen—and this counts as one. 

  That day was November 27, 2016. Heavy morning rain stole away the autumn outing. But in the afternoon the weather cleared without a trace. You smiled then and said you hoped sixteen would be just like that day—rain gone, sky bright. And so it was. You see, your sixteen truly was wonderful. In the year that should not have existed, your soul grew swiftly, stumbling and rising again and again.

  You are still flamboyant—but when did the you who loved attention and excitement also grow fond of the ease and quiet of being alone?
  You are still ambitious—but when did the you who once could not bear the slightest failure learn to let go, to take things lightly, to laugh them off?
  You are still full of sentiments—but when did the you who once wanted to bare your fiery heart for all to see learn instead to savor the emotions of the moment in silence, to wait quietly for the dream to end?

  Now you are seventeen—the last year before adulthood, the finest age under the sun: a little older is too ripe, a little younger too green. You have dreams, and yet you have none; you stand at a new beginning, with a future stretching endlessly before you.

  At seventeen, please be a very good person—broad enough, compassionate enough, clear and open as the sky after rain, generous in heart and spirit.
  May your smile never fade;
  may you have one or two true friends to share quiet cups and soft songs;
  may you ascend even on the loneliest road.
  May you “face wind and rain alike,” and may you also reach the realm where “there is neither wind nor rain nor clear sky.”

  May you become better, but may you also become like the wind—
  with mountains and lakes, not piles of homework, filling your eyes;
  with sunlight warm and clouds drifting slow above you.
  Walk the roads you wish to walk, do the things you love to do, love the people you long to love.

  May the sky of your seventeenth year be without regret and without bitterness.
  (And even in a foreign land, may these words—to which you have bowed and looked up in awe—forever remain in your blood.)
