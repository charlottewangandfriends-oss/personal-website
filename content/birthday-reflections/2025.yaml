year: '2025'
date: '2025-11-27'
bodyZh: |-
  清说，二十五岁使得变老的感觉无比真实；因为它是一百的四分之一。假如我们能够活到一百岁，人生已经过完四分之一了。
  
  你八岁的生日也是在感恩节。那时，生日是一个值得从月初就开始期盼的日子。前一天的晚上，你会因为“睡着睡着就八岁了”，而兴奋地睡不着。生日当天，你会觉得那一天是充满魔力般地不寻常。你会在晚上不愿告别特殊的日子，会在次日洋洋洒洒写下一篇（对于二年级小朋友来说）长长的日记回味。哪怕时至今日，你依然能对孩提时代的那种激动记忆犹新。过生日的魔法随着年龄增长递减。而今，生日从“值得庆祝”的一件事变成了“需要直面”的事。如清所言，没有什么好庆祝的——这不过意味着我们离死亡更近了一步。
  
  （当然，在美国租车不用再交一大笔young driver fee也许还是值得庆祝一下的。）
  
  也许人生就是一个又一个的轮回。你刚刚结束的二十四岁，正如十六岁，是夹缝中的一年——旧的故事已经结束，而新的故事还未开始。你二十四岁的底色是迷茫——如十六岁而更甚，也许是因为如今动荡的世界使得你个人的存在显得更加渺小、脆弱、飘摇；也许是因为如今你学会了拷问自己为什么，而不再能接受浑浑噩噩。
  前半年的迷茫，是驶出熟悉的水域，被命运的洋流裹挟着前进时，不知道会被带到哪里的迷茫。二十四岁的冬日里，你一次又一次地被拒绝，学会慢慢地接受了“你很好，但是还是不够好”的事实。当你走出最熟悉的校园，在机场和火车站中穿梭，以客人的视角窥探未来可能的模样；回家的时候，你才发现，原来你那个视作家的小楼，原来那么小，那么暗，而你就在那样一个小小的地方成长了四年，从一颗幼苗成长成小树，你这才意识到，原来那个地方已经装不下你了。你想起曾经的声乐大师课上，二十三岁的你风华正茂，好像拥有全世界；艺术家看着你感慨，说在这样一座小城里见到你你让她想起了自己，因为她也曾经从一座小城里走出，她深刻地意识到那意味着什么。二十四岁的你，终于也知道那意味着什么了——原来那个象牙塔，是一个你一旦离开，再也回不去的地方。
  
  二十四岁有一个温暖而圆满的死亡。二十三岁的时候写下了安魂曲，曲中，你以为你如同你笔下的“逝者”一般接受了生命轮回的本质。那时你没有意识到，那会在一年后的夏天，成为你生活的主题曲；而在你真正需要面对的时候，你才意识到，哪怕是一个小型的、形而上学的死亡，释怀起来也是那样的难。你在回收的勃二的分谱中看见写着自己的中提琴谱，意识到很多年后，它会在重见天日，躺在某个人的谱架上你轰轰烈烈浓墨重彩的五年，承载了好多欢笑和好多的泪点五年，不过是漫长历史中的一瞬间。于是你安静而孤独地把二十三岁的自己埋葬在那个寻常的夏天，等待太阳在那个地方升起，新的故事上演，与你的故事相似，却不再与你有关。你笑着又或者哭着告别那些你深爱的，故事才刚刚开始的孩子，意识到他们的故事也不会再有你。然后你发出长叹——没有人可以永远年轻，但永远有人年轻着。
  
  后半年的迷茫是船只飘入新的水域，面对苍茫无际海天一线时不知何去何从。面对崭新的维度，曾经的意义已经过时，而新的意义还没有诞生。你必须把曾经的自己打碎，却不知道什么时候能在火中重新长成一个崭新的，自洽的，坚固的新形状。你一月到安娜堡时，天地间白茫茫的一片混沌；二月再去时，大地已经苏醒，寒冷间已隐隐有了春意；而如今，这里已经成为了你的新家。你见过了深秋的层林尽染，当大地再次覆上白雪的时候，你开车上学的时候，已经不再需要导航。你好像在这一片大地上，找到了一点自己的位置，然后告诉自己，以后会更好。
  
  你的二十四岁是下山。你的二十三岁是一座高山，当你站在山顶时，你以为着拥有全世界，但二十四岁时你抬眼望去，山的另一面是更多的绵延不尽的山。你在Dear Past, Dear Tomorrow 的终章，你让主人公怀瑾走在童年县城的夕阳下漫步于回忆之间；你打下“She knew what to do”，似乎自己也从此不再惧怕跨越人生的孤岛；但二十四岁，你终于又要跨越人生的孤岛，直面人生碎片化的本质时，你才意识到，原来只要活得够长，人生的大课题从来不会只考一次，而且不会每次都出原题。面对刚刚解锁了完全体的人生，好多你以为有答案的问题，都需要重新作答。你必须在新的旷野中思考很多你曾经不必思考的问题，试图在零落的人生碎片中寻找永恒的、贯穿始终的锚点。好多事情，当下的你也没有答案。你活在过去和现在的夹缝之中，因为过去是对抗当下的混沌的武器——毕竟，你也不知道Who you are without your past。你在短暂的被定义当下的定义的空隙中寻找不被定义的自由，又在广袤的不被定义的人生中寻找定义，譬如想要的生活或是想到达的彼岸，譬如爱情与取向，婚姻和家庭。你和自己的非常达成和解——从你的酷儿特性到神经性非典型——又试图在充满框架的社会中找到一个保持一个微妙的平衡，以找到可以容身的地方。
  
  现在你二十五岁——大概是人生的四分之一。你接受自己的衰老，接受自己逐渐下降的新陈代谢，日益疲惫的体力，和开始衰老的皮肤；不再好用的记忆力，逐日枯竭的灵感和不再好用的脑子。你接受青春离自己远去，而有一些地方再也回不去。但是你还有四分之三的人生要走。你才刚刚成为一个真正的大人，并且解锁许多大人才有的资格；你才刚刚有一个家，你才刚刚推开一扇门，走上一条很长的路。有人说，二十五岁正是人生的清晨，你终于可以真正的出发。你依然拥有着无限可能。
bodyEn: |-
  David said that turning twenty-five makes the feeling of growing old unbearably real—after all, it is one quarter of a hundred. If we do get to live up to a hundred, then a full quarter of life has already slipped by.

  You remember that your eighth birthday also fell on Thanksgiving. In those days, a birthday was something worth anticipating from the very first day of November. You could be too excited to sleep, thrilled by the thought that you would turn eight as you slept. On the day itself, you felt as though the world had turned strangely magical. At night you were reluctant to let go of such a special day, and the next morning you would spill onto the page a diary entry that was—at least for a second-grader—long and luxuriant in its delight. Even now, you can vividly recall that childhood excitement. The magic of birthdays fades as we grow older. Today, a birthday has shifted from something to celebrate into something to confront. As David said, there is nothing to celebrate—it’s just one step closer to death.
  (Of course, being able to rent a car in the U.S. without paying the exorbitant young-driver fee might still be worth a small celebration.)

  Perhaps life really is a series of cycles. The twenty-fourth year you just completed—like your sixteenth year—was a year caught in between: the old story had ended, and the new story had not yet begun. The underlying tone of twenty-four was confusion—just like sixteen, but deeper. Perhaps it is because today’s turbulent world makes your own existence feel even smaller, more fragile, more precarious; or perhaps it is because you now know how to ask why, and can no longer accept drifting through life without understanding.

  The confusion of the first half of the year came from sailing out of familiar waters, carried forward by fate’s current, unsure of where you would land. In the winter of your twenty-fourth year, you were rejected again and again, and slowly came to accept the truth that “you are very good, but still not good enough.” You stepped outside your home-like campus, wandering through airports and train stations, glimpsing the possible outlines of your future through a visitor’s eyes. When you finally returned home, you suddenly realized how small and how dim that building truly was. But in that tiny place, you had spent four years growing from a young seedling into a small tree. Only then did you realize that the place could no longer contain you. You remembered a voice masterclass years ago: you were then full of radiance, as if you had the whole world in your heart; the artist looked at you, slightly moved, saying that meeting you in such a small town reminded her of herself, for she too was from a small town, and knew deeply what that meant. At twenty-four, you finally understood as well—that that bubble is a place one can leave, but can never return to.
  Your twenty-fourth year contained a warm and complete death. You wrote your Requiem at twenty-three, when you believed that you had accepted, like the “deceased” under your pen, the cyclical essence of life. You didn’t realize then that one summer later it would become the theme of your own life—and that when it came time to face it, even a mini metaphysical death would be so difficult to reconcile with. You saw the viola part with your name as you filed away parts of Brahms 2, and realized that years from now it would resurface, lying on someone else’s music stand. Your five brilliant and vividly colored years—carrying so much laughter and so many tears—are only a fleeting instant in history. And so, quietly and alone, you buried your twenty-three-year-old self in that ordinary summer, as you waited for the sun to rise there again, and for the new stories to begin—ones similar to yours, yet no longer yours. Smiling, or perhaps crying, you said goodbye to the kids you loved, whose stories were only just beginning but would no longer contain you from then on. And then you sighed—no one stays young forever, but there is always someone young.
  The confusion of the latter half of the year was that of a ship drifting into an unknown ocean, facing a vast horizon where sea and sky merge, unable to see the path ahead. With new dimensions, old meanings had expired and new meanings had not yet come into being. You had to break apart the person you used to be, though you did not know when a new, coherent, resilient self would grow again from the flames. When you arrived in Ann Arbor in January, everything was in boundless white; as you came again in February, the earth had already begun to stir, faint hints of spring hidden beneath the cold. And now, this place has become your new home. You have seen the blazing colors of late autumn; and when the land was covered once more in snow, you no longer needed GPS to drive to school. Somehow on this stretch of earth you found a place for yourself, and you told yourself that things will only get better.
  Your twenty-four was about getting down from the mountain in order to go on. Your twenty-three had been a high peak—standing at its summit, you thought the world was yours. But at twenty-four, when you lifted your gaze, you saw the other side of the mountain: endless ranges stretching far beyond. At the end of Dear Past, Dear Tomorrow, you let your protagonist Huai-jin walk beneath the sunset of her childhood town, wandering among memories; you wrote, “She knew what to do,” as though you too were no longer afraid to cross the lonely islands of life. But at twenty-four—when you once again had to cross one of life’s islands and confront the fragmentary nature of existence—you finally realized that as long as one lives long enough, life’s great questions are never asked only once, and they certainly never merely repeat themselves. Facing the fully unlocked difficulty of life, many questions you thought you had answered must now be answered anew. In this new wilderness, you must reconsider questions you once could ignore, trying to find an eternal anchor among the scattered fragments of life. Many things, your present self still does not know.
  You live in the narrow space between past and present, because the past is your weapon against the chaos of the now—after all, you yourself do not know who you are without your past. You search in the brief moments when you are defined by the present for the freedom of not being defined, and in the wide unboundedness of the undefined you search for definition—what kind of life you want, what step you hope to reach; questions of romantic and sexual orientation, of marriage and family. You have reached a deep reconciliation with yourself—from your queerness to your neurodivergence—while still trying to maintain a delicate balance within a world full of frameworks, so that you might find a place where you can live and belong.
  Now you are twenty-five—perhaps a quarter of a life. You accept your aging, accept your slowing metabolism, your increasingly weary body, and your skin beginning to show age; your memory that no longer serves you well, your inspiration that drains day by day, your mind that no longer works as sharply as before. You accept that youth is receding from you, and that some places can never be returned to again. But you still have three-quarters of your life ahead. You have only just become a true adult and only just unlocked many of the privileges of adulthood; you have only just gained a home and begun building a family, only just opened a door and stepped onto the entrance of a long road. Some say that twenty-five is the very dawn of life—that this is the moment you can finally set out for real. You still hold within you infinite possibility. Happy Birthday, Charlotte, and welcome to the real world.

