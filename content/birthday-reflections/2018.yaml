bodyZh: |-
  18🎂

  你今天十八岁了。

  当你身边的第一个挚友过十八岁生日的时候，你且惊且恐，颇有不可置信的味道；然后你身边的人一个一个十八了，你渐渐习以为常。

  然后你也十八了。

  这一年可真是一言难尽。

  十七岁的你是夏洛特，是以前那个你形而上学的延续，却又是一个截然不同的人。

  你在这片陌生的土壤里扎了根。然回头望去，过去的一切，好像是另一辈子的事儿了，支离破碎地不真实着，在空中浮动。

  而以前不真实的，却又真实了起来。你再也不会在周末的早上一觉醒来，问自己是王舒尧还是夏洛特。那个叉路口的标志远了；你渐渐觉得自己似乎命定地来到这里，命定要遇见某些人一样。你开始想一些你以前不曾想过的事儿，且觉得你似乎命定要想这些事儿一般。

  十一月。十七岁的前夕，因阿妹对你说她十五岁和最好的人在一起，你赌气地回复一句——我的十七岁也要和最好的人在一起。只是你没想到，这一句竟然是能成真的。摇晃的歌声、躲雨的屋檐，你说这是你十七岁也不愿意醒来的一场梦，而命运偏偏让你把这场梦做下去。噢，对的，说到十七岁，你不能不提到那个男孩子；毕竟你的十七岁是他，他十七岁是你。

  十二月。经历了四个月的异国他乡的漂泊，你说你终于在这个小小的校园落地生根了。那是你最好最好的日子。你说：“也许爱真的是一种救赎吧。”你终于中喧嚣里窥见了生活可以有的样子。欣喜若狂之余，你觉得日子应该是蒸蒸日上的了。但也是在十二月，你回到故乡，却发现原来世界已经远去了；你看见故人并着肩，抱着强化在阳光下悠悠离去的时候，心醉之余，也有几分怅然。也是在十二月，你才渐渐意识到，所谓蒸蒸日上的人生，不过是从一个笼子跳到另一个更精致的笼子里而已。

  一月。天很冷。刚回来便碰上两天雪假。光秃秃的日子里，你发现十六岁时候的那位老朋友又回来了。溺水一般的窒息、铺天盖地的压抑。你在灰暗的基调下喘息着寻找阳光。那天你第一次牵了一个男孩子的手；看着他离开的时候，你忽然意识到原来摄魂怪亲吻过的岁月的碎片里，生活也可以这样美好。你说，你要很努力地去生活。

  二月。背景还是灰暗的，你却渐渐开始珍惜着平凡的一切。冬假里你搬了房间，从此你有了家；当你第一次在自己的房间里熬夜学习的时候，你忽然意识到，自己如此幸运。二月，你开始习惯每天下午Weeks门前的微风。你知道，这个最平凡的相遇背后是无数种数不清的可能，而你，站在这里，也许已经耗尽了所有的运气。

  三月，四月，五月。春天。不经意间，你才发现你已经走出了这么远，而你们也走过了这么远的路。日子过得平静，你却最清楚自己在迷茫的漩涡里陷得多深。眼前的路是看不清的，身后的路已经成了烟云，唯有现在像手中的流沙，怎么也抓不住。也许当你拿着电话说得语无伦次、哭得像个孩子的时候，你才不得不承认，也许醉心于平凡的生活是真，却也是存了逃避的心思的。

  那个夏天是美的。那个下午，你仿佛看见了天光，在迷雾里第一次窥见了未来的样子。这么久以来，你终于看到过去、现在和未来被穿成了一条线。你第一次找到了一件你愿意做一辈子的事情。也是那一天，你的灵魂第一次和另一个灵魂贴的那样近。那时你想，原来那个最幸运的人是你。

  后来你才知道所谓的永恒都是错觉，而所有的美好都是用来摔碎的。八月。那个下午，Weeks的风很轻。走的时候你还是回了头——也许是一种本能吧，毕竟那时候，你什么也感觉不到。就像你没有料到它会在十七岁开始一样，你没有想到它会在十七岁落幕。然后你的世界从此变了。在支离破碎的废墟上浴火重生，你成功了；可是你又成为了一个新的人，又不能再看清过去、现在和未来的联系了。

  然后，十一月了。十八岁的前夕也有一场梦。做梦的时候你清醒着，却还是盼望着梦能停留的久一点。梦醒的时候，你也淡然了。你说：“我该知足了。” 现在你十八岁。写下这句话的时候你已经十八岁了。站在十八岁的路口，前面是传说中纷杂错乱的大世界，你忽然觉得，你是如此的渺小。但你想，也许还是有些什么不一样的地方吧——如今的你知道，纵然渺小，一步一步，你也总能踩在地上了。

  那么，你就一步一步走下去吧。也许你不知道你会走向哪里，也许你面对命运的确无能为力。但是，你总还是可以知道下一步踩在哪里。那么你就一步一步走下去吧。 “嘶哑着便嘶哑着吧

  倘若还能发声

  请许我用尽全力地放歌

  用尽全力

  反正也不能感受到疼痛。” 听闻——人曾经所热爱的一切，往往是如今为之悲伤的一切。

  那么，我祝你往后的日子，永远痛苦，永不悲伤。

  王舒尧。夏洛特。

  十八岁生日快乐呀。
bodyEn: |-
  Today, you are eighteen.

  When the first close friend beside you turned eighteen, you were startled and fearful, with a faint taste of disbelief. Then, as the people around you turned eighteen one after another, you gradually got used to it.
  And now—you are eighteen too.

  This year has truly been something beyond words.

  At seventeen, you became Charlotte, a metaphysical continuation of the person you once were, yet also someone entirely different.
  You took root in this unfamiliar soil. But looking back, everything from before seems as though it belonged to another lifetime—shattered, unreal, drifting in the air.
  And the things that once felt unreal have grown real. You no longer wake up on weekend mornings and ask yourself whether you are Shuyao or Charlotte. The signpost at that fork of life has grown distant; you’ve begun to feel as though you were destined to come here, destined to meet certain people. You have started thinking thoughts you never used to think, and it feels as though you were destined to think them.

  November.
  On the eve of seventeen, when your bestie told you she had spent fifteen with the best people, you shot back in annoyance—I want to spend my seventeen with the best person too.
  You never imagined that this sentence could come true. The duet voice swinging in the bus, the eaves where you hid from the rain—you called it a dream you wouldn’t want to wake from even at seventeen, and fate insisted on letting you keep dreaming. Oh, right—speaking of seventeen, you cannot fail to mention that boy; after all, your seventeen was him, and his seventeen was you.

  December.
  After drifting for four months in a foreign land, you said that you finally put down roots in that small campus. Those were your best, best days. You said: Perhaps love truly is a kind of salvation.
  In the midst of the clamor, you finally glimpsed what a life could look like. In your joyful frenzy, you felt your days ought to rise and rise from here. But also in December, when you returned to your hometown, you discovered the world had already slipped far away; watching old friends walking shoulder to shoulder, hugging their instruments as they wandered off beneath the sun—you were intoxicated, and yet faintly desolate. And also in December, you slowly realized that the thriving life you once longed for was indeed no more than jumping from one cage into another more refined cage.

  January.
  The days were cold. You returned only to be greeted immediately by two snow days. In those bare, stripped-down days, your old friend from sixteen returned again: that drowning suffocation, that overwhelming oppression. You searched for sunlight while gasping through the gray.
  That was the day you held a boy’s hand for the first time; watching him leave, you suddenly understood that even within the soul-sucking fragments kissed by a Dementor, life could still be this beautiful. You said you would work very hard to live.

  February.
  The backdrop was still gray, yet you slowly began to cherish the ordinary. During winter break you moved rooms, and from that moment on, you finally had a home. The first time you stayed up studying in your own room, you suddenly realized how lucky you were. In February, you began to grow used to the late afternoon breeze in front of Weeks Hall.
  You knew that behind this most ordinary encounter lay countless possible worlds—and you, standing there, may have already used up all your luck.

  March, April, May.
  Spring.
  Unaware, you found that you had walked a long way, and that the two of you had walked a long way together.
  Life passed quietly, yet you knew better than anyone how deep you were sinking in the whirlpool of confusion. The road ahead was invisible, the road behind had turned into mist, and only the present lay like sand in your hand—unable to be held. Perhaps it wasn’t until the day you spoke into the phone in broken sentences, crying like a child, that you were forced to admit: yes, being enamored with ordinary life was real—but it also contained a hint of escape.

  That summer was beautiful.
  That afternoon, you felt you saw the light of heaven, glimpsing—for the first time through the fog—the shape of the future. After so long, you finally saw past, present, and future threaded into a single line. You found, for the first time, something you would be willing to do for a lifetime. And on that day, your soul pressed closer to another soul than ever before. At that moment, you thought: So the luckiest person… is me.

  Later, you learned that so-called eternity is always an illusion, and all beautiful things are meant to shatter.
  August.
  That afternoon, the breeze at Weeks was light. As you left, you still turned back—perhaps out of instinct, for you could feel nothing at all then. Just as you never expected seventeen to begin as it did, you never expected it to end as it did. And after that, your world changed. From the broken ruins you rose again, reborn in fire; you succeeded. But you also became a new person, and once again you could no longer see the threads linking past, present, and future.

  And then—November.
  The eve of eighteen brought another dream. You were awake inside the dream, yet wished it would stay a little longer. When the dream ended, you were already calm. You said: I should be content.

  Now you are eighteen. By the time you write this sentence, you are already eighteen. Standing at the crossroads of eighteen, with the legendary chaotic, tangled world ahead of you, you suddenly feel how small you are. But you think—perhaps something is different now: you now know that even if you are small, step by step, you will still be able to set your feet on solid ground.

  So go on—take one step, then another.
  Perhaps you do not know where you are headed; perhaps, before fate, you are truly powerless. But at the very least, you can always know where your next step will land.

  So take one step, and then another.

  “Let the voice grow hoarse then—
  If it can still be heard,
  let me sing with all my strength,
  with all my strength,
  for the pain will not reach me anyway.”

  I once heard—everything a person has ever loved often becomes everything they are now sorrowful for.

  So I wish, in the days to come, that you will forever feel pain, but never sorrow.

  Shuyao Wang. Or Charlotte.
  Happy eighteenth birthday.
