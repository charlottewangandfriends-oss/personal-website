  你今天十八岁了。

  当你身边的第一个挚友过十八岁生日的时候，你且惊且恐，颇有不可置信的味道；然后你身边的人一个一个十八了，你渐渐习以为常。

  然后你也十八了。

  这一年可真是一言难尽。

  十七岁的你是夏洛特，是以前那个你形而上学的延续，却又是一个截然不同的人。

  你在这片陌生的土壤里扎了根。然回头望去，过去的一切，好像是另一辈子的事儿了，支离破碎地不真实着，在空中浮动。

  而以前不真实的，却又真实了起来。你再也不会在周末的早上一觉醒来，问自己是王舒尧还是夏洛特。那个叉路口的标志远了；你渐渐觉得自己似乎命定地来到这里，命定要遇见某些人一样。你开始想一些你以前不曾想过的事儿，且觉得你似乎命定要想这些事儿一般。

  十一月。十七岁的前夕，因阿妹对你说她十五岁和最好的人在一起，你赌气地回复一句——我的十七岁也要和最好的人在一起。只是你没想到，这一句竟然是能成真的。摇晃的歌声、躲雨的屋檐，你说这是你十七岁也不愿意醒来的一场梦，而命运偏偏让你把这场梦做下去。噢，对的，说到十七岁，你不能不提到那个男孩子；毕竟你的十七岁是他，他十七岁是你。

  十二月。经历了四个月的异国他乡的漂泊，你说你终于在这个小小的校园落地生根了。那是你最好最好的日子。你说：“也许爱真的是一种救赎吧。”你终于中喧嚣里窥见了生活可以有的样子。欣喜若狂之余，你觉得日子应该是蒸蒸日上的了。但也是在十二月，你回到故乡，却发现原来世界已经远去了；你看见故人并着肩，抱着强化在阳光下悠悠离去的时候，心醉之余，也有几分怅然。也是在十二月，你才渐渐意识到，所谓蒸蒸日上的人生，不过是从一个笼子跳到另一个更精致的笼子里而已。

  一月。天很冷。刚回来便碰上两天雪假。光秃秃的日子里，你发现十六岁时候的那位老朋友又回来了。溺水一般的窒息、铺天盖地的压抑。你在灰暗的基调下喘息着寻找阳光。那天你第一次牵了一个男孩子的手；看着他离开的时候，你忽然意识到原来摄魂怪亲吻过的岁月的碎片里，生活也可以这样美好。你说，你要很努力地去生活。

  二月。背景还是灰暗的，你却渐渐开始珍惜着平凡的一切。冬假里你搬了房间，从此你有了家；当你第一次在自己的房间里熬夜学习的时候，你忽然意识到，自己如此幸运。二月，你开始习惯每天下午Weeks门前的微风。你知道，这个最平凡的相遇背后是无数种数不清的可能，而你，站在这里，也许已经耗尽了所有的运气。

  三月，四月，五月。春天。不经意间，你才发现你已经走出了这么远，而你们也走过了这么远的路。日子过得平静，你却最清楚自己在迷茫的漩涡里陷得多深。眼前的路是看不清的，身后的路已经成了烟云，唯有现在像手中的流沙，怎么也抓不住。也许当你拿着电话说得语无伦次、哭得像个孩子的时候，你才不得不承认，也许醉心于平凡的生活是真，却也是存了逃避的心思的。

  那个夏天是美的。那个下午，你仿佛看见了天光，在迷雾里第一次窥见了未来的样子。这么久以来，你终于看到过去、现在和未来被穿成了一条线。你第一次找到了一件你愿意做一辈子的事情。也是那一天，你的灵魂第一次和另一个灵魂贴的那样近。那时你想，原来那个最幸运的人是你。

  后来你才知道所谓的永恒都是错觉，而所有的美好都是用来摔碎的。八月。那个下午，Weeks的风很轻。走的时候你还是回了头——也许是一种本能吧，毕竟那时候，你什么也感觉不到。就像你没有料到它会在十七岁开始一样，你没有想到它会在十七岁落幕。然后你的世界从此变了。在支离破碎的废墟上浴火重生，你成功了；可是你又成为了一个新的人，又不能再看清过去、现在和未来的联系了。

  然后，十一月了。十八岁的前夕也有一场梦。做梦的时候你清醒着，却还是盼望着梦能停留的久一点。梦醒的时候，你也淡然了。你说：“我该知足了。” 现在你十八岁。写下这句话的时候你已经十八岁了。站在十八岁的路口，前面是传说中纷杂错乱的大世界，你忽然觉得，你是如此的渺小。但你想，也许还是有些什么不一样的地方吧——如今的你知道，纵然渺小，一步一步，你也总能踩在地上了。

  那么，你就一步一步走下去吧。也许你不知道你会走向哪里，也许你面对命运的确无能为力。但是，你总还是可以知道下一步踩在哪里。那么你就一步一步走下去吧。 “嘶哑着便嘶哑着吧

  倘若还能发声

  请许我用尽全力地放歌

  用尽全力

  反正也不能感受到疼痛。” 听闻——人曾经所热爱的一切，往往是如今为之悲伤的一切。

  那么，我祝你往后的日子，永远痛苦，永不悲伤。

  王舒尧。夏洛特。

  十八岁生日快乐呀。
