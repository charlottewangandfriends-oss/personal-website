bodyZh: |-
  夏洛特，22岁生日快乐🎂

  二十一岁，你逐渐习惯做一名大人。

  你越来越明白你做了什么样的选择，也渐渐清楚你走上了一条艰难的路。只是你如今因为坚定而安心。十九岁的时候，你还会因为住进别人家的大房子而辗转反侧地抚平失衡的心态。二十一岁，你已经可以一笑置之。你知道你不会有钱，你的未来不可能天天买奶茶，你的假期也许不会常常有游艇和海岛，你逛街的时候没办法不看价格便随手买下你看上的裙子——“可是这又怎么样呢？” 你说，音乐是时间的艺术，可以把生活中转瞬即逝的瞬间拉到很长很长。有了那些在舞台上绽放的瞬间，人生虽然很短，但也是值得的吧。

  但是你的面前依然是一个分叉口。你发现，人生不是某一次选择，而是无止境的选择。“我到底想要什么？”这不是你第一次问自己这个问题，也不会是最后一次。如今，你已经能欣然接受你是芸芸众生中普通的一员，也习惯于作为一个普通人去追求自己的幸福。但偶尔，你总会沉入自己的内心，审视自己的野心。都说，英雄造时势，时势造英雄。当属于自己的时代来临的时候，你真的不会想乘着浪潮拼上一把吗？但是，你又是否愿意为之放弃许多你本来可以拥有的小确幸呢？

  放弃 — 这可能是你人生中最难的课题。当你有了选择的能力，你毕定要面对与放弃相关的选择，并为之承担所有的后果。你知道，你确实是一个充满欲望的人，也愿意为自己的欲望买单。可是，毕竟不是所有的事情都像读三个专业那样简单，也不是所有的双倍付出能简单地转化成双倍所得。有时候，选项本身不能兼容。有时候，你也没有那么多可以给予——毕竟你只是一个凡人，每天要睡满八个小时的那种。你为了一节课放弃另一节课。你为了专业放弃了学到N2级别的日语课和伴随你整个高中时代的击剑与戏剧。二十一岁，你发现你要做的选择越来越难，越来越痛。比被迫失去更难的，是被迫选择失去。

  你常常因不堪选择的重担而选择逃避。就像在晚饭的时候你总是让一起吃饭的朋友选择饭馆一样，你总是让major requiremets决定你的选课；人生中，你也总喜欢让环境来替你做出最终的选择。你说，你觉得自己像一颗蒲公英，风吹到哪里就是哪里，你都能过的安宁。你说，有时候，你不知道在命运面前人到底有没有选择的权利，不知道自由意志的存在是否是一种错觉。也许到人生的某个时候，你能够找到答案，但是不是现在。

  “消除欲望，忍受苦难，六根清净。”你练习着不去期盼，远离执念，但是你知道你不是没有欲望的，也不是没有遗憾的。不然，你又为什么愿意相信平行世界呢？“想象着，这个世界里不能存在的一种可能性能在某一个平行世界存在，缺了一角的内心好像也能得到安宁。”

  二十一岁，你在陌生中寻找熟悉，在熟悉中拥抱陌生。

  你总是说，“四海为家”。你也很早就知道，也许你不会回到故乡度过余生。但是以前，你也不曾想过，你会回不去你的家。你不曾想过，也许某一天，你会没有家。二十二岁前夕，你忽然意识到，你也许不想接受你曾经被动接受的爱情的样子，也许不能再像以前那样去爱了，于是不得不重新思考究竟想把爱情推向什么方向。在纷乱世事的变幻下，计划得再精密的未来，也不过是薛定谔的幸福。

  转眼，你这一代人已经成为了时代漩涡的中心。总是感慨历史，却忘了，我们本就生在历史中。如今，站在这个岔口，你为自己的价值实现而迷茫，为家国的何去何从而迷茫，为世界的每况愈下而迷茫。但也许，每一个从未来变成现在的时刻，你能做到挪动脚下的这一步，做这一刻想做的事，爱这一刻想爱的人。
bodyEn: |-
  Charlotte, happy 22nd birthday 🎂

  At twenty-one, you gradually grew accustomed to being an adult.

  You understood more clearly the kind of choices you had made, and you slowly recognized that you had stepped onto a difficult path. Yet now, your certainty brings you peace.
  At nineteen, you would still toss and turn after moving into someone else’s large house, struggling to steady your sense of imbalance.
  At twenty-one, you can brush it off with a laugh.
  You know you won’t be rich; your future will not include affording one milk tea every day; your breaks may not often involve yachts and tropical islands; and when you shop, you cannot pick up the dress you like without looking at the price tag.
  “But so what?” you say.
  Music is the art of time—it stretches fleeting moments of life into something long, long-lasting. With those moments that bloom on stage, even if life is short, it is still worth living.

  And yet, a fork in the road still lies before you.
  You realize that life is not about a single choice, but about choices without end.
  “What do I really want?”
  This is not the first time you’ve asked yourself that question, and it will not be the last.
  Now, you can calmly accept that you are one ordinary person among millions, and you’ve grown accustomed to pursuing your happiness as an ordinary person.
  But sometimes, you still sink into your own mind and examine your ambition.
  They say heroes shape the times, and the times shape heroes.
  When your era arrives, will you truly not want to ride the rising tide and fight your way upward?
  But are you willing to give up all the small, certain happiness you could have had?

  To let go—this may be the hardest lesson of your life.
  Once you gain the ability to choose, you must inevitably face choices that involve giving something up, and you must shoulder all their consequences.
  You know you are a person full of desires, and you are willing to pay the price for them.
  But not everything is as simple as completing three majors, and not every doubled effort yields doubled reward.
  Sometimes, two options are inherently incompatible.
  Sometimes, you simply don’t have that much to give—after all, you are a mortal being who really does need eight hours of sleep every day.
  You gave up one class for another.
  You gave up the Japanese course you had worked to N2 level, and the fencing and drama that accompanied your entire high school life—for the sake of your major.
  At twenty-one, you discovered that the choices you must make are growing harder and more painful.
  More difficult than losing without choice is being forced to choose what to lose.

  Often, overwhelmed by the burden of choosing, you choose instead to avoid it.
  Just as you always let your dinner companions pick the restaurant, you let major requirements choose your courses;
  in life, you tend to let the environment make your final decisions.
  You say you feel like a dandelion—wherever the wind blows, you drift there, and you can live peacefully anywhere.
  You say that sometimes you don’t know whether humans truly have the right to choose in the face of fate; you don’t know whether free will is an illusion.
  Perhaps one day in the future, you’ll find the answer—but that day isn’t now.

  “Eliminate desire, endure suffering, keep the six senses pure.”
  You practice not expecting, distancing yourself from attachment.
  But you know you are not without desire, nor without regret.
  Otherwise, why would you choose to believe in parallel worlds?
  “To imagine that a possibility impossible in this world might exist in some parallel world—somehow, that missing corner in the heart feels soothed.”

  At twenty-one, you searched for familiarity in the unfamiliar, and found newness within the familiar.

  You often say you are “at home wherever you go.”
  You knew early on that you probably wouldn’t spend the rest of your life in your hometown.
  But you never imagined that one day, you might not be able to return home at all.
  You never imagined that someday, you might have no home.
  On the eve of turning twenty-two, you suddenly realized that perhaps you no longer wanted to accept the kind of love you once passively accepted;
  perhaps you can no longer love the way you once did.
  And so you are forced to rethink what direction you want to steer love toward.
  Under the shifting chaos of the world, even the most meticulously planned future is nothing more than Schrödinger’s happiness.

  In the blink of an eye, your generation has become the center of the era’s whirlpool.
  You lament history so often, forgetting that you were born in history.
  Now, standing at this crossroads, you are confused about your own value, confused about the fate of your country, confused about a world that grows worse with each passing year.
  But perhaps, at every moment that turns from future into present, you can still take the step beneath your feet—do what you want to do in this moment, love the people you want to love in this moment.
