  夏洛特，22岁生日快乐🎂

  二十一岁，你逐渐习惯做一名大人。

  你越来越明白你做了什么样的选择，也渐渐清楚你走上了一条艰难的路。只是你如今因为坚定而安心。十九岁的时候，你还会因为住进别人家的大房子而辗转反侧地抚平失衡的心态。二十一岁，你已经可以一笑置之。你知道你不会有钱，你的未来不可能天天买奶茶，你的假期也许不会常常有游艇和海岛，你逛街的时候没办法不看价格便随手买下你看上的裙子——“可是这又怎么样呢？” 你说，音乐是时间的艺术，可以把生活中转瞬即逝的瞬间拉到很长很长。有了那些在舞台上绽放的瞬间，人生虽然很短，但也是值得的吧。

  但是你的面前依然是一个分叉口。你发现，人生不是某一次选择，而是无止境的选择。“我到底想要什么？”这不是你第一次问自己这个问题，也不会是最后一次。如今，你已经能欣然接受你是芸芸众生中普通的一员，也习惯于作为一个普通人去追求自己的幸福。但偶尔，你总会沉入自己的内心，审视自己的野心。都说，英雄造时势，时势造英雄。当属于自己的时代来临的时候，你真的不会想乘着浪潮拼上一把吗？但是，你又是否愿意为之放弃许多你本来可以拥有的小确幸呢？

  放弃 — 这可能是你人生中最难的课题。当你有了选择的能力，你毕定要面对与放弃相关的选择，并为之承担所有的后果。你知道，你确实是一个充满欲望的人，也愿意为自己的欲望买单。可是，毕竟不是所有的事情都像读三个专业那样简单，也不是所有的双倍付出能简单地转化成双倍所得。有时候，选项本身不能兼容。有时候，你也没有那么多可以给予——毕竟你只是一个凡人，每天要睡满八个小时的那种。你为了一节课放弃另一节课。你为了专业放弃了学到N2级别的日语课和伴随你整个高中时代的击剑与戏剧。二十一岁，你发现你要做的选择越来越难，越来越痛。比被迫失去更难的，是被迫选择失去。

  你常常因不堪选择的重担而选择逃避。就像在晚饭的时候你总是让一起吃饭的朋友选择饭馆一样，你总是让major requiremets决定你的选课；人生中，你也总喜欢让环境来替你做出最终的选择。你说，你觉得自己像一颗蒲公英，风吹到哪里就是哪里，你都能过的安宁。你说，有时候，你不知道在命运面前人到底有没有选择的权利，不知道自由意志的存在是否是一种错觉。也许到人生的某个时候，你能够找到答案，但是不是现在。

  “消除欲望，忍受苦难，六根清净。”你练习着不去期盼，远离执念，但是你知道你不是没有欲望的，也不是没有遗憾的。不然，你又为什么愿意相信平行世界呢？“想象着，这个世界里不能存在的一种可能性能在某一个平行世界存在，缺了一角的内心好像也能得到安宁。”

  二十一岁，你在陌生中寻找熟悉，在熟悉中拥抱陌生。

  你总是说，“四海为家”。你也很早就知道，也许你不会回到故乡度过余生。但是以前，你也不曾想过，你会回不去你的家。你不曾想过，也许某一天，你会没有家。二十二岁前夕，你忽然意识到，你也许不想接受你曾经被动接受的爱情的样子，也许不能再像以前那样去爱了，于是不得不重新思考究竟想把爱情推向什么方向。在纷乱世事的变幻下，计划得再精密的未来，也不过是薛定谔的幸福。

  转眼，你这一代人已经成为了时代漩涡的中心。总是感慨历史，却忘了，我们本就生在历史中。如今，站在这个岔口，你为自己的价值实现而迷茫，为家国的何去何从而迷茫，为世界的每况愈下而迷茫。但也许，每一个从未来变成现在的时刻，你能做到挪动脚下的这一步，做这一刻想做的事，爱这一刻想爱的人。
