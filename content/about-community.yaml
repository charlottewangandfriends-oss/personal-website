title: Music, Community, and Human Connection
body: >-
  At this early stage of her career, Charlotte is still discovering what kind of
  conductor, musician, and person she hopes to become. What she knows clearly is
  her love for music as a shared human experience, and her desire to create
  rehearsal rooms where people feel heard, trusted, and inspired to give their
  best. In addition to professionalism and perfectionism, she approaches
  conducting with curiosity and care, believing that clarity, generosity, and
  interpersonal connection are what allow music to truly come alive.
cardDescription: >-
  Charlotte's conducting philosophy, building trust and inspiration in rehearsal
  rooms, and approaching music as a shared human experience.
