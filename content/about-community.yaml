title: Music, Community, and Human Connection
body: |-
  Charlotte chose a life in music because of her love for people and her belief
  in music's power to cross boundaries—of language, background, age, and
  experience.

  When Charlotte first arrived in the United States, before she could express
  herself fluently in English, music gave others a way to know her. In time, it
  also became one of the deepest ways she learned to know other people. Her path
  in music began in community—in the trust of rehearsal, the generosity of
  listening, and the act of creating something no one could make alone. However
  far this path takes her, she never wants to forget where it began.

  ## Community & Education

  That commitment has shaped Charlotte's work in very different musical
  communities. One of her earliest professional experiences was an internship
  with the Chattanooga Boys Choir. After graduating from Amherst, she spent a
  year teaching in the college's Music Department and worked especially closely
  with first-year students. Several of the students she guided at the beginning
  of college later chose to major in music. For Charlotte, this is what teaching
  can do at its best: not simply pass on knowledge, but help someone recognize a
  path as their own.

  As assistant conductor of Voices Valiant, a community choir for older adults,
  Charlotte encountered an ensemble shaped by long lives and by the realities of
  aging, illness, loss, and change. Its singers nevertheless brought
  extraordinary commitment and generosity to every rehearsal. At one concert,
  Charlotte joined the accompanying ensemble as a violist, playing for the same
  singers she had helped lead. From inside the ensemble, the usual
  distinctions—conductor and singer, professional and amateur, teacher and
  student—fell away. She was struck by a simple thought: we are the same.
  Everyone was offering what they could, listening to one another, and making
  something together. The singers gave so much—to the music, to one another, and
  to everyone who heard them. Charlotte carries that example with her.

  ## Charlotte & Friends

  Charlotte also loves chamber music with people at every level—from
  professional musicians to those who make music purely for joy. In Ann Arbor,
  she has played string quartets with friends whose careers lie outside music.
  Around four music stands, titles and résumés matter less than listening:
  breathing together, adjusting to one another, taking turns leading, and making
  room for every voice.

  For Charlotte, making music together creates a bond that nothing else can
  replace. It is not music as display, but music as friendship—made with others,
  and belonging to everyone in the room.
cardDescription: >-
  Why Charlotte chose music—and how community, teaching, and chamber music shape
  her belief in music as a way of knowing one another.
