title: Why I Make Music
body: |-
  I did not choose music because I had a theory about its power to bring people
  together. The simpler answer is that I love people, and I kept finding them
  through music.

  When I first came to the United States, my English was often not enough for
  what I wanted to say. In rehearsal, I could still contribute: I could listen,
  sing, or play, and work on the same phrase as everyone else. Music did not
  erase the distance between us, but it gave us something real to do together.
  That mattered to me then, and it still does.

  ## Teaching

  One of my earliest professional experiences was two years as an artistic
  intern with the Chattanooga Boys Choir. My last term was cut short by the
  pandemic, and I never properly said goodbye. When I returned six years later,
  the little sopranos and altos I had known were tenors and basses. One of the
  most energetic boys from the front row had become a mentor to the younger
  singers. I also spent five days with a new group of boys: watching them learn,
  make friends, help one another, get stuck, and keep going. I was there to
  teach them, but being with them gave something back to me too.

  During my year as a Graduate Associate in the Amherst College Music
  Department, I taught ear training across two semesters. Many of my students
  were first-years. Some were already my friends; others became friends along
  the way. What I remember most is seeing them begin to belong to the department:
  studying and spending time together in Arms, showing up for one another's
  concerts, and sitting in a row in the audience when I was the one performing.
  At our last class, I cried. They would keep growing at Amherst, and I would not
  be there to see it. I was glad to have known them at the beginning.

  As assistant conductor of Voices Valiant, a community choir for older adults,
  I worked with singers from very different musical backgrounds. Many were also
  dealing with illness, loss, or the changes that come with age. They still came
  to rehearsal and cared about the music. At one concert, I played viola in the
  accompanying ensemble instead of conducting. Looking across at the singers I
  had rehearsed with, I stopped thinking about who was the conductor, who was
  the singer, who was professional, and who was amateur. I remember thinking,
  simply: we are the same. We were all trying to listen and give what we could.
  I have not forgotten that.

  ## Music Without a Résumé

  In Ann Arbor, I also play string quartets with friends whose careers have
  nothing to do with music. Often there is no concert at the end and nothing to
  put on a CV. We meet because we want to play together. That is reason enough.
  It matters to me even if no one else hears it.

  I am building a professional life in music, and I care deeply about craft,
  preparation, and standards. But professionalism is not why I started, and I
  do not want ambition to make me forget the people beside me. I do not think of
  community as the “outreach” part of my work. It is where the work started. I
  want to do serious work without losing that.
cardDescription: >-
  A personal note on why I make music, from teaching and community choirs to
  playing with friends.
