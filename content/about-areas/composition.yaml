title: Composition
eyebrow: Music & text
intro: >-
  Charlotte's compositions grow from language, voice, memory, and ensemble
  storytelling.
body: |-
  Charlotte studied composition with Eric Sawyer at Amherst College. Her honors thesis, Requiem: Ceaseless Life, is an eight-movement work for baritone soloist, SATB choir, and reduced orchestra, bringing together her interests in poetry, vocal writing, and large-ensemble form.

  Her other works include Your Spring, L'Avril à Nashville, and When Viola Breathes, you can hear my voice. Across different forces, she is drawn to music that feels lived-in: shaped by words, relationships, and the particular people making it.
