title: Conducting
eyebrow: On the podium
intro: >-
  Working across orchestral and choral repertoire, Charlotte came to conducting
  through many ways of making and understanding music. Composition, singing,
  piano, viola, percussion, scholarship, and work within ensembles all converge
  in how she hears a score and leads a room.
body: |-
  Charlotte did not arrive at Amherst College intending to pursue music professionally. Her early musical life was broad but uneven: piano, choir, percussion, accumulated musical ideas, and a developing knowledge of theory. At Amherst, she discovered that music could be at once a serious intellectual discipline, a collaborative practice, and a meaningful way of life. Entering the field by an indirect route continues to shape her approach—with humility, curiosity, and a willingness to learn by doing.

  During college, she moved among ethnomusicology, theory and history, composition, singing, instrumental performance, and work with choral and orchestral ensembles. Rather than competing interests, these experiences gradually came into focus through conducting. Donald Schleicher's description of the conductor as "artist, scientist, leader, and diplomat" resonated with her liberal-arts formation in music, mathematics, and literature: conducting asked her to unite close analysis and artistic imagination with leadership, trust, and communication.

  That convergence became tangible in Requiem: Ceaseless Life, her senior thesis: a fifty-minute choral-orchestral work she composed, organized, and conducted with 41 musicians whom she invited individually. The project taught her that conducting is not only interpretation or technique, but also the patient work of earning trust, creating shared purpose, and making space for many musicians to build something none could make alone. After graduation, she remained at Amherst as a Graduate Associate in Music, taking on greater musical and departmental responsibility while preparing for graduate study.

  At the University of Michigan, where she studies choral conducting with Dr. Eugene Rogers, intensive rehearsal, coursework, and mentorship are helping Charlotte turn that expansive foundation into a more deliberate professional practice. Her continued study of voice and collaborative piano is not separate from her work on the podium; it sharpens her understanding of breath, language, color, timing, and partnership, while regular work with ensembles turns those ideas into practical rehearsal craft.

  Charlotte's development also extends well beyond school. Through conducting retreats, masterclasses, and workshops in the United States and Europe, she has sought out unfamiliar ensembles, teachers, and rehearsal cultures, then carried that learning into performance. At the Conductors Retreat at Medomak, she conducted Jessie Montgomery's Strum for string orchestra. In the Czech Republic, masterclass and workshop study led to public concerts of the finale of Mahler's Fourth Symphony with soprano Anastasia Fedorenko and the Moravian Philharmonic Orchestra in Olomouc, and Beethoven's Fifth Symphony with the Orchestra of the City of Ústí nad Labem. These experiences have made the unpredictability and responsibility of a conducting life concrete—and strengthened her commitment to building one.

  Everything Charlotte has done in music feeds into conducting: scholarship shapes how she questions a score; composition teaches her to hear structure from within; singing makes breath and language physical; instrumental playing deepens her respect for the work asked of an ensemble; and collaboration teaches her to listen, adjust, and build trust. Through conducting, she brings these strands together in one shared act of music-making—analytical and imaginative, decisive and humane.
highlightsHeading: Selected Conducting Engagements
highlights:
  - date: February 3, 2024 · Amherst College
    title: 'Requiem: Ceaseless Life'
    description: >-
      Charlotte composed, organized, and conducted her fifty-minute honors
      thesis for baritone soloist, SATB choir, and reduced orchestra, bringing
      together 41 musicians.
    href: /media/composition/requiem
    linkLabel: Explore the Requiem
  - date: October 16, 2025 · University of Michigan
    title: 'Pergolesi: Magnificat'
    description: >-
      Co-conducted with Sophie Choate in a public performance by the Orpheus
      Singers at Stamps Auditorium.
    href: https://smtd.umich.edu/event/16-october-2025/
    linkLabel: Official event page
  - date: July 12, 2026 · Washington, Maine
    title: 'Jessie Montgomery: Strum'
    description: >-
      Conducted for string orchestra at the 30th Conductors Retreat at Medomak,
      sharing the work with fellow conductor Charles Taylor.
    href: https://conductorsretreat.org/info/repertoire/
    linkLabel: Retreat repertoire
  - date: August 7, 2026 · Olomouc, Czech Republic
    title: 'Mahler: Symphony No. 4 — Finale'
    description: >-
      Conducted soprano Anastasia Fedorenko and the Moravian Philharmonic
      Orchestra in the final public concert of the International Conducting
      Masterclass led by Arturo Tamayo.
    href: https://www.mfo.cz/program/mahler-4-symfonie-a-anastasia-fedorenko/
    linkLabel: Official concert page
  - date: August 16, 2026 · Ústí nad Labem, Czech Republic
    title: 'Beethoven: Symphony No. 5'
    description: >-
      Conducted from the third movement through the exposition of the finale
      with the Orchestra of the City of Ústí nad Labem in a public concert of
      the International Conducting Workshop & Festival, led by Farkhad Khudyev
      and Rei Hotoda.
    href: https://www.conductingworkshop.org/workshops/icwf-2026-nbobo-august
    linkLabel: Official festival schedule
