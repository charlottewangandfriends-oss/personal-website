title: Conducting
eyebrow: On the podium
intro: >-
  Charlotte works across orchestral and choral repertoire, approaching
  conducting as a practice of listening, clarity, and collaboration.
body: |-
  At the University of Michigan, Charlotte studies choral conducting with Dr. Eugene Rogers and has worked with ensembles including the Orpheus Singers and Voices Valiant. At Amherst College, she served as Assistant Conductor of the Amherst Symphony Orchestra and Amherst Choral Society, then continued supporting rehearsals, performances, and music theory instruction as a Graduate Associate in Music.

  Her work on the podium is informed by her experience as a composer, singer, pianist, violist, and percussionist: each perspective changes how she listens to an ensemble and how she communicates in rehearsal.
