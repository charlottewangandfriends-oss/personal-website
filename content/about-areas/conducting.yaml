title: Conducting
eyebrow: On the podium
intro: >-
  Working across orchestral and choral repertoire, Charlotte came to conducting
  through many ways of making and understanding music. Composition, singing,
  piano, viola, percussion, scholarship, and work within ensembles all converge
  in how she hears a score and leads a room.
body: |-
  Charlotte did not arrive at Amherst College intending to pursue music professionally. Her early training was broad but uneven: piano, choir, percussion, musical ideas, and a developing knowledge of theory. At Amherst, she discovered that music could be at once an intellectual discipline, a collaborative practice, and a meaningful way of life. Entering the field by an indirect route continues to shape her approach—with humility, curiosity, and a willingness to learn by doing.

  During college, she moved among ethnomusicology, theory and history, composition, singing, instrumental performance, and work with choral and orchestral ensembles. Rather than competing interests, these experiences gradually came into focus through conducting. A mentor's description of the conductor as "artist, scientist, leader, and diplomat" resonated with her liberal-arts formation in music, mathematics, and literature: conducting asked her to listen analytically and imaginatively while connecting people to one another and to the score.

  That convergence became tangible in Requiem: Ceaseless Life, her senior thesis: a fifty-minute choral-orchestral work she composed, organized, and conducted with 41 musicians whom she invited individually. The project taught her that conducting is not only interpretation or technique, but also the patient work of earning trust, creating shared purpose, and making space for many musicians to build something none could make alone. After graduation, she remained at Amherst as a Graduate Associate in Music, taking on greater musical and departmental responsibility while preparing for graduate study.

  At the University of Michigan, where she studies choral conducting with Dr. Eugene Rogers, intensive rehearsal, coursework, and mentorship are helping Charlotte turn that expansive foundation into a more deliberate professional practice. Her continued study of voice and collaborative piano is not separate from her work on the podium; it sharpens her understanding of breath, language, color, timing, and partnership. Everything she has done in music feeds into conducting—and through conducting, she seeks to bring analytical rigor, artistic imagination, clarity, and human connection into one shared act of music-making.
