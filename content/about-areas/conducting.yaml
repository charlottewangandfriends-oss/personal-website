title: Conducting
eyebrow: On the podium
intro: >-
  Few conductors come to the podium as composers, singers, collaborative
  pianists, and orchestral players in both strings and percussion. Charlotte
  does. Each discipline changes what she hears in a score, what she notices in
  rehearsal, and how she speaks to an ensemble.
body: |-
  Charlotte graduated summa cum laude from Amherst College with majors in Music, Mathematics, and English. Her range is practical, not decorative. As a composer, she understands harmony, pacing, orchestration, and large-scale form as choices made from inside a piece. As a soprano, she knows breath, vowel, diction, and the physical reality of sustaining a line. Collaborative piano has trained her to anticipate another musician and adjust in real time. Viola and percussion have placed her inside two very different areas of the orchestra, with different relationships to gesture, timing, color, and responsibility. Mathematics and literature add structural precision and close attention to language.

  This combination makes Charlotte especially fluent where musical languages meet. She can think about a phrase as text, harmony, breath, bow, attack, balance, and dramatic time—not as separate concerns, but as parts of the same decision. Her work moves naturally between choral and orchestral repertoire, between singers and instrumentalists, and between analysis and instinct.

  Charlotte has already carried unusually ambitious projects from idea to performance. For Requiem: Ceaseless Life, she composed a fifty-minute, eight-movement score for baritone soloist, SATB choir, and orchestra; recruited 41 musicians individually; organized the project; and conducted its premiere. The work required a complete view of the score, the rehearsal room, the people, and every practical step needed to make a large performance exist.

  At Amherst, Charlotte served as Assistant Conductor of both the Amherst Symphony Orchestra and Amherst Choral Society. Her conducting credits range from concerto repertoire there, including Grieg and Tchaikovsky, to Pergolesi's Magnificat at Michigan; Jessie Montgomery's Strum at the Conductors Retreat at Medomak; Mahler's Fourth Symphony with soprano Anastasia Fedorenko and the Moravian Philharmonic Orchestra; and Beethoven's Fifth with the Orchestra of the City of Ústí nad Labem. In workshops and public concerts, she has shown that she can learn quickly, make clear decisions, and build productive relationships with unfamiliar ensembles.

  At the University of Michigan, Charlotte studies conducting with Eugene Rogers, voice with Stanford Olsen, and collaborative piano with Ana María Otamendi. What distinguishes her is not simply that she has done many things. It is that she can turn them into specific rehearsal choices: what to hear, what to ask for, and how to help an ensemble get there.
highlightsHeading: Selected Conducting Engagements
highlights:
  - date: February 3, 2024 · Amherst College
    title: 'Requiem: Ceaseless Life'
    description: >-
      Charlotte composed, organized, and conducted her fifty-minute honors
      thesis for baritone soloist, SATB choir, and reduced orchestra, bringing
      together 41 musicians.
    href: /media/composition/requiem
    linkLabel: Explore the Requiem
  - date: October 16, 2025 · University of Michigan
    title: 'Pergolesi: Magnificat'
    description: >-
      Co-conducted with Sophie Choate in a public performance by the Orpheus
      Singers at Stamps Auditorium.
    href: https://smtd.umich.edu/event/16-october-2025/
    linkLabel: Official event page
  - date: July 12, 2026 · Washington, Maine
    title: 'Jessie Montgomery: Strum'
    description: >-
      Conducted for string orchestra at the 30th Conductors Retreat at Medomak,
      sharing the work with fellow conductor Charles Taylor.
    href: https://conductorsretreat.org/info/repertoire/
    linkLabel: Retreat repertoire
  - date: August 7, 2026 · Olomouc, Czech Republic
    title: 'Mahler: Symphony No. 4 — Finale'
    description: >-
      Conducted soprano Anastasia Fedorenko and the Moravian Philharmonic
      Orchestra in the final public concert of the International Conducting
      Masterclass led by Arturo Tamayo.
    href: https://www.mfo.cz/program/mahler-4-symfonie-a-anastasia-fedorenko/
    linkLabel: Official concert page
  - date: August 16, 2026 · Ústí nad Labem, Czech Republic
    title: 'Beethoven: Symphony No. 5'
    description: >-
      Conducted from the third movement through the exposition of the finale
      with the Orchestra of the City of Ústí nad Labem in a public concert of
      the International Conducting Workshop & Festival, led by Farkhad Khudyev
      and Rei Hotoda.
    href: https://www.conductingworkshop.org/workshops/icwf-2026-nbobo-august
    linkLabel: Official festival schedule
