title: Piano
eyebrow: At the keyboard
intro: >-
  Piano was Charlotte's first instrument. After a long and sometimes
  complicated relationship with it, she found her way back through
  collaboration—discovering the keyboard as a meeting place for musicians.
body: |-
  Charlotte began playing before her fifth birthday. Her relationship with the instrument was not always an easy one: early training gave her persistence, but also left technical habits and assumptions that she later needed to reconsider. Returning to serious study as an adult meant rebuilding patiently—first with Hiromi Fukuda at Amherst College, who reshaped her technique and taught her how to practice and listen, and then with Ana María Otamendi at the University of Michigan, whose exacting, empathetic guidance helped Charlotte grow into a more independent and responsive musician.

  Collaboration gave that return its purpose. Concerto reductions, chamber duos, composition premieres, and work with singers and instrumentalists revealed a different kind of virtuosity: the piano's ability to enter almost any musical world and help another musician speak. At Amherst, partnerships with horn players Cecelia Amory and John Joire led from recital repertoire to an Emanuel Ax masterclass. At Michigan, joint studio projects widened that practice through violin and saxophone repertoire, including performances with Anika Patel and Abner Brijesh.

  A spontaneous return to Amherst in May 2026 became a particular turning point. Preparing the third movement of a Hindemith viola sonata with Benjamin Hanselman in roughly two weeks required Charlotte to research, learn, rehearse, and make musical decisions with unusual speed and independence. The experience allowed her to recognize collaborative piano not simply as a skill she was developing, but as a musical identity of her own.

  At the keyboard, Charlotte listens for breath, timing, color, and shared direction—supporting without disappearing, leading without forcing, and responding in real time. Collaborative piano brings together her instincts as performer, conductor, composer, and listener. She now maintains ongoing partnerships with a growing circle of vocalists and instrumentalists, developing repertoire together across lessons, rehearsals, recitals, and recordings. More simply, collaboration lets her make music with people she cares about, growing alongside the instrument rather than chasing a path that might have been.
