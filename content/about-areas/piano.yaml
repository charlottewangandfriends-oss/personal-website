title: Piano
eyebrow: At the keyboard
intro: >-
  At the piano, Charlotte works collaboratively with singers and
  instrumentalists, listening for breath, timing, color, and shared direction.
body: |-
  Charlotte began playing piano at age five. Alongside her conducting studies at the University of Michigan, she has continued her work in collaborative piano with Dr. Ana María Otamendi.

  She values the particular kind of musicianship the piano asks for in collaboration: supporting without disappearing, leading without forcing, and responding to another musician in real time.
