title: Piano
eyebrow: At the keyboard
intro: >-
  Piano was Charlotte's first instrument. After a long and sometimes
  complicated relationship with it, she found her way back through
  collaboration—discovering the keyboard as a meeting place for musicians.
body: |-
  Charlotte began playing before her fifth birthday and returned to serious study in recent years, rebuilding her technique and learning to listen anew. She is deeply grateful to Hiromi Fukuda at Amherst College and Ana María Otamendi at the University of Michigan, whose guidance helped practice become a natural, exploratory part of her musical life again.

  Collaborative work gave that return its purpose. Through chamber music, composition premieres, and projects with singers and instrumentalists, Charlotte came to value the piano's extraordinary ability to enter almost any musical world. Preparing a movement of Hindemith's Viola Sonata on short notice for a friend's recital became a turning point: learning, researching, rehearsing, and shaping the work together allowed her to recognize herself, with new confidence, as a collaborator.

  At the keyboard, Charlotte listens for breath, timing, color, and shared direction—supporting without disappearing, leading without forcing, and responding in real time. Collaborative piano brings together her instincts as performer, conductor, composer, and listener. More simply, it lets her make music with people she cares about, growing alongside the instrument rather than chasing a path that might have been.
