title: More
eyebrow: Beyond one label
intro: >-
  Charlotte's musical life also includes viola, percussion, chamber music,
  writing, and collaborations that resist a single category.
body: |-
  Playing inside an orchestra and making chamber music continually reshape Charlotte's understanding of leadership. Her experience on viola and percussion gives her a physical, inside-the-ensemble perspective on gesture, rhythm, balance, and trust.

  Writing is another part of the same creative life. Across fiction, poetry, essays, and musical collaboration, she returns to questions of memory, identity, human connection, and what becomes possible when people listen closely to one another.
