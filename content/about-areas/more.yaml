title: Percussion & Viola
eyebrow: Beyond one label
intro: >-
  Percussion was Charlotte's first seat inside an instrumental ensemble; viola
  came later. One taught her how to wait and enter. The other taught her how to
  breathe and shape sound with the people around her.
body: |-
  Charlotte started percussion by accident. In her final year of high school, she had hoped to play piano in the string orchestra, but it conflicted with choir. The band needed someone who could read pitches and cover mallet parts, so she joined after a handful of hurried lessons. There she learned for the first time how to read an individual part, move between instruments, and be solely responsible for a line that no one else was doubling.

  At Amherst, percussion often meant long rests followed by an exposed entrance, or covering several instruments in an understaffed section. Charlotte learned to stop treating counting as the whole job and to locate each entrance within the full score. She eventually played tam-tam and cymbals in Mahler's Fifth from the conductor's score; in a crowded Gershwin setup, reaching the vibraphone in time required going underneath the xylophone. Her chamber projects included John Cage's Living Room Music and Mark Applebaum's Catfish with the Amherst Percussion Ensemble.

  Percussion is difficult to sustain without regular access to instruments and ensembles, and Charlotte plays it less often now. She still returns when a project needs her. Recent performances have included timpani for Amherst College Vespers, snare drum for a choral Commencement concert, percussion at the Conductors Retreat at Medomak, and marimba in a Chattanooga Boys Choir staff talent show.

  Charlotte began viola in early 2021. After only two or three weeks, she carried a rental instrument to Amherst's Book & Plow Farm and played simple melodies at sunrise. Four years later, at her final Amherst Symphony Orchestra gathering, she returned to the same fields with her own viola. By then, the instrument had taken her through orchestral concerts, chamber music, and the viola-and-voice duet she wrote upon leaving Amherst. The physical closeness of string playing—the sense that the instrument can breathe and tremble with the player—gave her a way of understanding sound that neither piano nor percussion had offered.

  Moving between percussion and viola has let Charlotte experience the orchestra from both sides of the beat: the precision of an isolated attack and the continuous work of shaping a shared line. That knowledge stays with her on the podium. It also keeps her close to the pleasure of playing inside an ensemble, where leadership begins with listening to the musicians around you.
