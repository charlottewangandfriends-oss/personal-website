title: Voice
eyebrow: Breath & language
intro: >-
  Singing shapes how Charlotte hears breath, text, line, and the collective
  sound of an ensemble.
body: |-
  Charlotte is a soprano and a longtime choral singer. At the University of Michigan, she has continued her voice study with tenor Stanford Olsen while singing in and working with a range of university ensembles.

  Her experience inside the ensemble is central to her work as a conductor and composer. It keeps musical decisions connected to breath, diction, physical ease, and the trust required for people to sing together.
