heading: Charlotte Wang, conductor and more
bio: >-
  Shuyao “Charlotte” Wang (b. 2000) is a conductor whose work spans orchestral
  and choral repertoire, shaped by a strong background in both instrumental and
  vocal music. She approaches conducting as a practice of listening, clarity,
  and collaboration, drawing on her experience as a composer, soprano,
  collaborative pianist, as well as her orchestral experience as a percussionist
  and violist.


  In Fall 2025, Charlotte began a Master of Music in Choral Conducting at the
  University of Michigan, studying conducting with the acclaimed Dr. Eugene
  Rogers. She co-conducted the SMTD Orpheus Singers and assisted Voices Valiant,
  a local senior choir. Off the podium, she continued her passion for musical
  collaboration while furthering her study in voice with distinguished tenor
  Stanford Olsen and collaborative piano with Dr. Ana María Otamendi, a leading
  figure in the field. Besides professional and conservatory gigs, Charlotte
  also collaborates with musicians at different levels; these experiences
  continue to shape her understanding of the conductor as both a musical leader
  and a human connector within an ensemble.


  Charlotte graduated summa cum laude from Amherst College with a Bachelor of
  Arts in Music, Mathematics, and English. During her time at Amherst, she
  served as Assistant Conductor of the Amherst Symphony Orchestra and Amherst
  Choral Society, studying orchestral conducting with Mark Swanson, choral
  conducting with Arianne Abela, and composition with Eric Sawyer. Her honors
  thesis in music culminated in the composition and performance of her
  choral-orchestral work, Requiem: Ceaseless Life. Upon graduation, she was
  awarded The Eric Edward Sundquist Prize in Music. Following graduation, she
  remained at Amherst as a Graduate Associate of Music, continuing to assist in
  rehearsals and performances, conduct sectionals and smaller ensembles, and
  support music theory instruction. After she left Amherst, she was later
  awarded the Edward Poole Lay ’22 Fellowship for two consecutive years in
  support of her graduate study in music.


  Her conducting training includes participation in professional institutes,
  festivals, and masterclasses, where she has worked with conductors such as
  Neil Varon, Miguel Harth-Bedoya, Donald Schleicher, Farkhad Khudyev, Jonathan
  Girard, David Jacobs, Jerry Blackstone, William Weinert, Jeffery Douma, Deanna
  Joseph, and Daniel Bara. She has conducted and assisted in a wide range of
  symphonic and choral repertoire and continues to develop a clear, efficient
  physical technique and a thoughtful rehearsal process, in addition to her
  passion for and understanding of music.
