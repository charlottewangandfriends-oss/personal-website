heading: Charlotte Wang, writer
intro: >-
  Charlotte has been a writer first, perhaps long before she became a musician.
  Addicted to reading and writing from an early age, she excelled throughout her
  schooling in Chinese language and literature (the equivalent of English class
  in English-speaking countries) and received various writing prizes, including
  awards at the national level. For a long time, she believed she would become a
  writer or scholar in literature.


  Charlotte was admitted to Amherst College as a prospective English major,
  where she explored literature in many forms through the rich resources of
  Amherst’s distinguished English department. She dived into both critical and
  creative writing, while also taking cross-listed courses in education studies,
  American studies, legal studies, and theatre. Fluent in French, she also spent
  a year studying French literature in the original language. Across these
  studies, she became especially drawn to twentieth-century literature, with
  particular interests in time, memory, trauma, and the shaping of human
  consciousness — perhaps connected to her musician’s natural fascination with
  time.


  Charlotte writes extensively in both English and Chinese, with occasional work
  and adaptation in French. Her writing spans many creative genres, including
  fiction, nonfiction, poetry, and drama, as well as academic essays,
  publication contributions, and critical literary analysis. Though she later
  turned her primary professional commitment toward music, she continued her
  deep involvement in literature. At Amherst, she completed the English major
  with dedication and passion and wrote an honors thesis that received the only
  summa recommendation among creative English theses in her year.


  Although Charlotte is not currently pursuing a career in literature or
  publication, she considers writing an essential part of her identity. She may
  one day return to a larger literary project, but for now, writing remains
  woven into her daily life: a way of thinking, remembering, imagining, and
  understanding the world. She writes every day, and she will never stop
  writing.
