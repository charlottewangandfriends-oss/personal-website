body: >-
  You are enter a land outside professionalism or perfectionalism!

  This is a collections for spontaneous or informal music projects with friends
  that leads to neither a performance nor a recording for portfolio. This is the
  time when music is solely about the shared joy of making music where music is
  a transcendental way of interhuman connection.
