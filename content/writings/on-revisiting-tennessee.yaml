title: On Revisiting Tennessee
category: prose-blog
language: en
date: '2025-07-03'
body: |-
  I went back to visit Tennessee, the home to which I can never return.
  
  After hastily leaving because of COVID in 2020, I returned to Chattanooga once during the spring of my junior year in college. At the time, the freshmen from my senior year had become seniors themselves. (Interestingly, this time around, they would now be rising college juniors.) They were the last thread connecting me to my living high school memories — the past still felt vibrant and close. But this time, I could feel those memories fading into shadows.
  
  I had lived in Chattanooga for less than three years, but now I’ve been away for five. The younger students I once knew are no longer there. Many of the teachers have retired or moved away. The little boys I once led in the Chattanooga Boys Choir have long since grown — turning to tenors and basses. (I realized that a number of my current students in the classes of ’27 and ’28 are probably their age. But back then, those kids felt so small — how could they be the same?)
  
  The city was filled with fragments of memory: the riverbank where I used to sit and read alone; the downhill route I took after class to fencing; the doorway of the French classroom where I once leaned on the wall and cried; Lupton Circle where I paused to look at the stars after leaving the library at night; the chestnut bridge I walked across slowly with friends in the sunset,
  the North Starbucks where we pushed two tables together to study… Maybe it’s because it really has been a long time, but when those memories surface, the emotions — joy, anger, sorrow, delight — feel like they belong to someone else. And yet, at some moments, the version of me in those memories overlaps with who I am now. When I walked into Whole Foods, I was surprised by how clearly I still remembered the layout (those things, hadn’t changed).
  
  Three years — in hindsight, really quite short (especially since I later spent five years at Amherst). But somehow, those years happened to fall right in such a pivotal period of my life. I always knew I didn’t fully belong here — coming to Chattanooga felt like a beautiful accident. But it was here that I met so many important people who changed my life. I grew up. And the time I spent here became a part of my upbringing.
  My true life started there. It was here that I first learned to love — others and myself — and learned how to live.
  Here, I was truly seen for the first time, began to understand what “home” could mean, and started wondering what “life” was all about.
  
  I’ve been gone for many years, and I’m a completely new version of myself now. But walking these streets again, with sunlight on my skin, I realized how dear the Southern sun still is to me. In the future, I’ll keep growing and evolving — through countless mini deaths and mini rebirths. But the many fragments that make up who I am will always include this: I am a daughter of Tennessee, raised by the mountains and rivers here.
