title: On Teaching
category: prose-blog
language: en
date: '2025-05-08'
body: |-
  A year of growing through teaching has come to  an end… I truly feel that having teaching as part of my job has been such a gift.
  
  There’s nothing more joyful than watching my students grow. Many of them were already my friends, and the rest often became friends along the way. Some I taught all year—from 341 in the fall to 342 in the spring—and many of them were first-years. I had the privilege of guiding them through their first steps in Amherst’s music journey.
  
  I love watching my students perform—but when I’m the one on stage and see them sitting in a row in the audience, I get genuinely emotional. It means so much to me. I love seeing them sitting together in Arms, studying, hanging out, just being there for each other.
  
  This spring, I brought a few of the younger students to watch my Requiem from last year—it’s part of the legacy I leave behind here. I’m so glad they seemed to enjoy it. And during our last class together in Neopolitans & Fountain of Youth and Alex, I couldn’t help crying in front of them.
  
  I know these young students—especially the first-years—will take root here, and grow, and blossom in the years to come. But I won’t be here to see it. I’m heading off to a new world, starting again… chasing stars across the sea.
  
  I hope that my students and I can all shine brightly in the futures we can’t see, and maybe—just maybe—meet again when the time is right.
