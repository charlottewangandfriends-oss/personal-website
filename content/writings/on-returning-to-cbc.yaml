title: On Returning to CBC
category: prose-blog
language: en
date: '2026-07-26'
body: |-
  I returned to my beloved Chattanooga Boys Choir after six years. In 2020, my last term as artistic intern with CBC was interrupted by the COVID outbreak in March. I never had a chance to say goodbye to my boys.
  
  Six years later, the little sopranos and altos I worked with are now tenors and basses, the eldest among them almost graduating from college while the youngest are finishing their last summer at CBC before heading off to college. I wish I could have returned earlier, but I am so grateful that I can at least catch the last few this time. It meant a lot to see the most *energetic* boy sitting in the front years ago turn into a mentor and leader for the little one now. 
  
  And there are the new ones whom I hadn’t known; I got five days to know more and more about these little souls and then had to say goodbye. These past five days were dense, intense, yet rich and fulfilling. I saw them learn new things, jump up and down, make friends and help others, challenge themselves, get stuck and struggle but persevere through a theory practice. I was helping them grow, and they were healing me. 
  
  The castle I built years ago is growing into something bigger, and I know theirs will too.

