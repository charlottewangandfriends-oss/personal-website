title: "The Offer I Turned Down: Three Years in a Foreign Land"
category: prose-blog
language: en
date: '2020-07-16'
excerpt: A love letter to Chattanooga. English translation followed by the Chinese original.
body: |-
  *English translation*
  
  Although we are still taking classes online and rushing to finish assignments, we have all quietly acknowledged that we have already graduated from high school. As college offers arrived one after another in March, our high school days seemed to recede, little by little.
  
  My final choice came down to Vanderbilt, a top-fifteen university, and Amherst, a liberal arts college whose ranking hovered between first and second. It was not really a difficult choice. And yet, for reasons I could not quite explain, it weighed heavily on me.
  
  My high school was in Chattanooga, Tennessee, a city I had never heard of.
  
  A large proportion of its students were day students. Compared with schools in the Northeast, its boarding population was relatively limited in diversity, among both international and American students. I had come off its waiting list over the summer. It was the choice I was left with when there was no choice left to make.
  
  At the time, I did not know what it would mean to spend three years there.
  
  When I first arrived in tenth grade, alongside the excitement of everything new, I felt a lingering wistfulness I could not shake.
  
  Later, I gradually understood where it came from: we international students had come from all over the world, and we would leave for all over the world. From the beginning, we were destined to be only passing through this beautiful little city.
  
  The people we met here were unlike our childhood friends, rooted in the same soil and growing alongside us for years. Nor were they like the people we might meet after settling down around thirty, knowing we would share the decades to come. Three years felt so hurried, as though nothing would have time to grow deep.
  
  My offer from Vanderbilt came after my offer from Amherst. That day, congratulations poured in.
  
  My band teacher, a Vanderbilt alumna, replied to the email in which I shared the news with several excited exclamation marks.
  
  A Chinese teacher at our school, who had always taken special care of international students, wrote to me herself: “We heard today that you got into Vanderbilt. Our whole family is so happy, because Vanderbilt is very close to our home.”
  
  My American friends and their parents left comments on Facebook. One woman posted a great big heart: “See? Tennessee wants you back.”
  
  For a moment, I had the strange impression that I was not an international student studying in a foreign country, but a child of Chattanooga. Like my day-student friends, whose parents would send them off to college with joy and a full heart, then wait for them to come home to this little city and tell them about the world beyond it.
  
  I could almost see what my college life would look like if I chose Vanderbilt.
  
  Even as an international student, perhaps I could have a home to return to often. I was close to so many Chattanooga families, almost as if I were their own daughter. I could picture who would be willing to drive an hour or two to Nashville to see me, just as they would visit a daughter. For someone who had been lonely since childhood, this sweet privilege was deeply tempting.
  
  Choosing Amherst in the Northeast, on the other hand, meant that the next time I returned to Chattanooga, I would be a visitor passing through.
  
  I cannot remember when I began to feel that I was putting down roots in Chattanooga.
  
  I think it began with my friends in choir. On the ride to the All-East Honor Choir festival, a few of us who loved to sing formed a deep friendship. I was the only boarding student among us.
  
  We chattered about gossip among the day students, about things happening in and out of school as day students and Chattanoogans saw them: A liked B and had gone on a date with her last night; someone did not understand the math homework and would have to get up early to drive to school and ask the teacher; someone had to work the evening after next... Somewhere along the way, I had begun to see so much of life inside and outside school through their eyes.
  
  Then I began visiting their homes often and getting to know their mothers. Their mothers asked me questions from the perspective of American adults, and made me American desserts and lunches.
  
  Before Halloween of my senior year, I wanted to make a Ming-dynasty-style hanfu, so I went to a friend's house to borrow a sewing machine. My friend's mother was an elementary school teacher, and her house was full of all kinds of costumes. When she heard that I wanted to make an outfit, she taught me how to use the sewing machine, step by step. She also invited me to wear it to her elementary school class in the spring, when they would be learning about Chinese history, and help explain it to the children. I happily agreed, and gave her the “one-time-use” hanfu I had made for the previous two Halloweens as well.
  
  When I was leaving for home because of the pandemic, she made a point of having someone bring me a card. She told me that her first thought on hearing that school was closing had been to take me in, but the school would not allow it. She also comforted me over my senior year ending so abruptly, without a proper conclusion. She herself had lost her husband just the previous December.
  
  I once had a boyfriend who lived locally. I often spent weekends at his house. We worked on the backyard together, made desserts, and assembled all sorts of curious electronics projects. Sometimes I went along with his family to run errands, buying this and that, or picking up flowers for the graves of family members. After he graduated, his mother and I still kept in touch.
  
  One of my Black friends stayed in town for college after graduating. His mother drove me downtown to my internship every Tuesday, and sometimes picked me up on weekends so I could get out for a while. She told me that she had always wanted a daughter, but had had a son.
  
  When I opened her Christmas gift, I found all kinds of things a girl might use, nothing expensive, but nothing forgotten: cotton gloves, socks, makeup, makeup-remover wipes, body wash... Suddenly I realized that she had shopped for me the way she would have shopped for a daughter.
  
  In my email to my choir teacher, I tucked my college admissions results and my decision in among all my other news.
  
  I wrote about my attachment to Chattanooga and how hard it was to leave. But my deep ties to Tennessee, and my love for it, were the very reasons I most needed to go.
  
  I quoted the lyrics of 《我用半生寻找一座山峰》 (“I Will Spend Half My Life Searching for a Mountain”), the song I had written for the Chattanooga Boys Choir: “I, too, am reluctant to leave my home and my mother. I, too, miss spring and its flowers. But life is too short, the world too vast, and I am still young...”
  
  The last line, the one I left unwritten, was probably already familiar by heart to this choir teacher, who had helped me revise the score so many times: “Nothing can keep me from setting out for distant places.”
  
  The song had been scheduled for the Chattanooga Boys Choir's year-end concert this May.
  
  I began my internship with the choir in the fall of my junior year.
  
  From then on, every Tuesday afternoon brought a group of little boys who called me “Miss Charlotte.”
  
  As their young teacher, my job at each rehearsal was to help the less secure sections sing the right notes and to lead sectional rehearsals, as well as keep things running backstage at every performance. At first, I followed the other teachers around, occasionally stepping in as a little helper when needed.
  
  Until one day, I suddenly realized that I could hold my own, too.
  
  After two years, the children knew me well. They listened to me during rehearsals and chattered away with questions during breaks. Through the choir, I had also built stronger connections in Chattanooga's music education community than many teachers just starting out.
  
  Often, as I quietly watched them singing so earnestly onstage, I would find myself thinking that if this were what the rest of my life looked like, it would not be a bad life. But a deep sadness always followed: for my “colleagues,” their lives were these children, simple and happy. For me, it was only two years, already slipping away.
  
  In the year I graduated, I wrote the song for the children.
  
  I wrote that life was about finding a mountain and then climbing it. Neither hardship nor the warmth that made me want to linger would keep me from going on. The song was the truest reflection of how I felt at that moment, my simplest hope for their lives, and my deepest apology for no longer being able to stay beside them.
  
  A month later, as I began getting in touch with my future college classmates and imagining our life there, I suddenly realized that everything connected with “Tennessee” had already begun to fade out of my life. It was like an immortal's brief incarnation in the human world: once back in heaven, mortal life was only a dream.
  
  Just as I had foreseen so long ago, we had come from all over the world, and we were leaving for all over the world.
  
  All the depth I had fought so hard to give these years, all the roots I had tried so hard to put down, seemed to dissolve into thin air as those three years came to a close. I was no longer a daughter in this family or that one. I was no longer the children's Miss Charlotte. Three years without roots or an anchor: there was nothing I truly could not leave behind.
  
  But I knew, too, that these three years had left more than a shadow.
  
  As I wrote in one line of the song:
  
  “But I will always be grateful for these memories. They have made me who I am today.”
  
  *中文原文*
  
  虽然大家还在上着网课，赶着作业，但是我们都心照不宣地承认自己已经高中毕业了。在三月接踵而来的offer里，高中的日子好像一点一点远去了。
  
  我最后的选择落在了前十五的大学Vanderbilt和排名在一二晃悠的文理学院Amherst之间。这其实不是一个很难的选择，但是对我而言，却莫名的沉重。
  
  我的高中在田纳西查塔努加，一座我从来没有听闻的城市。
  
  学校的走读生比例很高，相对于东北的学校而言，无论是国际住宿生还是国内住宿生，多样性都相对有限。这是一个我夏天Waiting list转正的学校，我最后的没有选择的选择。
  
  彼时，我不知道在这里住三年意味着什么。
  
  当我十年级刚刚来到这所高中学校的时候，我在新奇之余又摆脱不了一种悠长的怅然。
  
  后来我渐渐明白了这种怅然来源于什么：我们这一群国际生，从五湖四海来，将要到五湖四海去。我们从一开始就注定了只是这座美丽的小城市的过客。
  
  在这里认识的人，不像幼时的玩伴，有着一样的土壤为根，还一起生长了许多年；也不像三十岁左右稳定下来之后认识的人，知道彼此往后的几十年都要作伴了。三年之仓促，好像什么也来不及深刻。
  
  拿到Vanderbilt的offer是在拿到Amherst的offer之后。那一天，我就收到了轰炸式的祝贺。
  
  我的管乐队老师是Vanderbilt的校友，她在回复我报喜的邮件里发了好几个激动的感叹号。
  
  我们学校一位一直对国际生照顾有加的中文老师专门发了一封邮件：“今天听说了你拿到Vanderbilt的offer，我们一家都非常开心，因为Vanderbilt离我们家很近。”
  
  我的Facebook下有各种美国朋友和他们的家长评论，一位太太评论了一颗很大的爱心：“看到了吧，田纳西希望你回来呀。”
  
  恍惚之间，我似乎有了一种错觉；觉得自己仿佛不是在异国他乡求学的留学生，而是查塔努加的孩子。就像我的走读生朋友那样，上了大学，家长开开心心又充满感慨地把他们送出这座小城，然后等着他们下一次回家说说自己在外的见闻。
  
  我仿佛能看到假如我选了Vanderbilt之后的大学生活的模样。
  
  身为国际生的我似乎也可以有一个常常回去的家——我和好多查塔努加的家庭都联系紧密，就像他们自己的女儿一样。我可以预见到有谁会愿意开一两个小时的车去纳什维尔看我，就像看自己的女儿一样。而这个甜蜜的特权对从小孤独的我充满了诱惑。
  
  而选择东北的Amherst，则意味着我下一次回查塔努加的时候，就是过路的客人了。
  
  我不记得我是什么时候，觉得自己已经渐渐在查塔努加扎根的。
  
  好像一开始是因为在合唱队的朋友。在All-East荣誉合唱节的车上，我们几个热爱唱歌的伙伴结下了很深刻的友情。其中，只有我是住宿生。
  
  我们絮絮叨叨地讲着走读生圈子的八卦，从走读生、查塔努加人的角度讲着校内校外的琐事：A喜欢B，昨天晚上和她出去约会啦；数学不会明天要早起自己开车来找老师问问题啦；后天晚上要去打工啦……不知道什么时候开始，就用走读生的视角看到了学校里外的这么多事。
  
  然后我开始常常去走读生们的家里玩，并认识了他们的母亲。他们的母亲从美国长辈的角度问我问题，给我做美国的甜点和午餐。
  
  Senior year的万圣节前，我想做一件明制汉服，去朋友家借用缝纫机。朋友的母亲是一个小学老师，她的家里堆满了各式各样的服装。听说我想做衣服，她手把手地教我用缝纫机，还邀请我在春天他们讲到中国历史的时候，到她的小学课上穿着这一身衣服帮忙讲解。我开心地答应了下来，还把以前两年万圣节做的“一次性”汉服都捐给了她。
  
  因为疫情回家的时候，她专门托人给我送了一张卡，告诉我她听到停课的消息的第一反应就是收留我，只是学校不允许。她还安慰了我因Senior year无疾而终的难过。而她在前一年十二月的时候刚刚丧夫。
  
  我曾经有一个本地的男朋友。周末的时候，我常常去他家玩。和他一起布置后院，做甜品，组装一些稀奇古怪的电子工程的玩意儿。有的时候，我跟着他们家一起“run errand”，采买各种各样的东西，或是去给家里的先人的墓买花。他毕业之后，我和他的妈妈还常联系。
  
  我的一位黑人朋友毕业之后就在当地读书。他的妈妈每周二送我去市中心实习，周末也偶尔接我出来玩。他的妈妈说她一直想要一个女儿，却生了一个儿子。
  
  当我拆开她送的圣诞礼物的时候，里面是各种各样不贵重却一应俱全的女孩子用的东西：棉手套，袜子，化妆品，卸妆巾，沐浴露……那时我忽然意识到，她是像给女儿买礼物一样给我买礼物的。
  
  我写给合唱老师的邮件里，我的录取结果和决定，是和我的各种近况混在一起写的。
  
  我写到了我对查塔努加的留恋和不舍，但我对田纳西深深的牵绊和爱，正是我离开她的最主要的理由。
  
  我引用了我写给查塔努加男童合唱团的歌《我用半生寻找一座山峰》的歌词：“我也留恋故乡和母亲，我也想念春天和花朵。但是人生太短，世界太大，而我还年轻——”
  
  而那没写出来的最后一句歌词，这位帮我改了很多遍作曲稿的合唱老师大概是烂熟于心的：“什么也不能阻挡我去向远方。”
  
  这首歌，原本在今年五月份，会在查塔努加男童合唱团的年终音乐会上表演的。
  
  我开始在查塔努加合唱团的实习，是在我十一年级的秋天。
  
  从此，每周二下午，就多了一群喊我“夏洛特小姐”的小男孩们。
  
  作为他们的"小老师"，我的任务是在每次排练的时候帮助薄弱的声部唱对音和组织分声部的练习，以及在每次表演的时候维持好后台的运作。一开始，我也是其他老师的小尾巴，在需要的时候偶尔当一下小助理。
  
  直到某一天，我忽然发现自己也能独当一面了。
  
  两年下来，孩子们已经和我很熟悉了。他们在排练的时候听我的话、在休息的时候也会叽叽喳喳地问我问题。因为合唱团的缘故，我也在查塔努加音乐教育界有了比很多新的老师都坚实的人脉基础。
  
  好多时候，我静静地欣赏着他们在台上认真地唱歌的样子，隐隐约约地觉得，如果我的一生就是这样了，也不错。但是随即而来的又是深深的心酸：对于我的“同事们”而言，他们的生活就是这些孩子——单纯而快乐。而对我而言，这不过是我转瞬即逝的两年而已。
  
  在我毕业的这一年，我给孩子们写了一首叫做《我用半生寻找一座山峰》的歌。
  
  我写道人生就是寻找一座山峰而后去攀登它。无论是艰苦的困难还是令人眷恋的温暖都不会让我停下。这首歌是我在这一刻最真实心态的写照，是我对他们的人生最单纯的期望，也是我因为不能再陪伴他们的最深的歉意。
  
  当一个月后，我开始和大学同学联系上，并且幻想着以后的大学生活的时候，我忽然意识到所有和“田纳西”有关的东西，已经从我的人生中淡去了。就像神仙的一场转世，回到仙界以后，凡尘只如一场梦。
  
  就像很久之前我所预料的那样，我们从五湖四海来，到五湖四海去。
  
  所有的拼尽全力的深刻，所有努力扎下的根，都随着三年的落幕，好像轻飘飘地烟消云散了。我再也不是这家和那家的女儿，我再也不是孩子们的夏洛特小姐。无根无凭的三年，没有什么是真正割舍不下的。
  
  但我也知道啊，这三年不仅仅只有一个影子而已。
  
  就像我在《我用半生寻找一座山峰》里写的一句：
  
  “但是我永远感激这些回忆，它们让我成为了如今的我。”
