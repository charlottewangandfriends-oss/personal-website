title: On Disability
category: prose-blog
language: en
date: '2026-09-20'
body: |-
  Over the past few days, David and I have talked about how he feels I’ve mellowed out, that I’m somehow less “acute” than I used to be, though he couldn’t name why when I asked him. To be honest, sometimes as the ordinary life flows, I do forget that I was once a hedgehog. However, I have never felt myself without my very distinct edges.
  
  This weekend felt almost like a system reset. At the worst of it, lying in bed in pain and confusion, I felt as though I had gone through some serious illness (even though a lot of the symptoms were, in fact, not so different from a very bad cold). And in that moment, I suddenly felt my disability was something realer than on paper. Back in July, I had wanted to properly celebrate Disability Pride Month, but alas, I never found the time to even produce some long reflection text like this. In some ways, though, this has actually been the year in which I have gradually made peace with my own disability. After graduating from college, I became increasingly aware of just how much my abnormality fails to fit into the world around me. At the beginning of this year, I finally received long overdue formal ASD and ADHD diagnoses (which surprised absolutely no one, myself included.)
  
  This year, I finally realized that I will probably never be normal. And I embraced that I will probably never be normal. Strangely enough, that peculiar kind of harmony may also be when I feel most powerful within myself. A lot of reconciliation comes from the feeling of: well, there is nothing I can do about it. This is already who I am. To be, or not to be, no third option.
  
  I sometimes think that my passion of education, along with a complicated kind of apprehension about it may have grown out of childhood trauma. When I work with children with ASD, I have wondered what my life might have looked like if someone had intervened when I was a child. Then, the solution was weird kids like me was simple: your parents beat you until you behaved normally. That situation lasted pretty much all the way until I was eleven,  when my brain had likely developed enough that I suddenly understood what kinds of behavior would keep me from being disgusted. In later years, most of the outward brokenness can be mellowed out. But some of what broke inside becomes much harder to ever repair, just like an ancient, terrible codebase that has somehow been running for years: patch after patch after patch, while the program keeps running. Broken, but internally consistent.
  
  Quite a few people have told me that they admire or envy my ability to *be myself*. I am glad that I have inspired people, though I don’t know if there’s anything laudable. The biggest reason behind is that I do not have another choice. It may be the only way I know to feel whole within a fragmented self. In other words, I know no other way to live. I recently mentioned to an Astro friend that I was probably a blue giant in a previous life. The gravitational force pulling me inward is so enormous that I have to keep burning (furiously, with everything I have) just to keep from collapsing into myself.
  
  This year (2026) also marks my tenth year fighting with depression (I keep thinking I should celebrate by setting some of the poems I wrote back then to music). Now I have been on medication for seven years: sometimes life goes so smooth and under control with treatment that I forget how bad it can be. My first three years of my depression went untreated though, which made me a survivor. Lately I have been thinking  survivor is an identity buried very deep inside me, and perhaps my biggest identity of all, because it is has changed my relationship with life and death form then on and cannot be undone. There was a time when I genuinely doubted I would live past 16 (alas, now I am almost 26). And when I am truly alone with myself late at night, I felt that every single day living on this world since then felt like some extra bonus. During these years, I felt at certain moments that I have a very strange kind of symbiosis with death, a feeling that I could walk out into a snowy night and simply disappear into it. That feeling of: I could have been long dead, and yet somehow I am still here. (Is this quantum entanglement? Maybe in another parallel world, I do have been long dead, lol).
  
  Maybe that is why I am so fascinated by the vastness of the stars and the universe. I think about us, and the Earth, eventually being swallowed by the Sun no matter what we do. Or about a gamma-ray burst possibly arriving the very next second from some nameless place deep in the universe and annihilating everything. And I can calmly embrace my (our?) smallness(and  preciousness)as human beings suspended between these infinities. It functions like religion in my life, where I can find anchor and peace. I find comfort in the never-lost past that the universe remembers, and in the possibilities of parallel worlds. Every day I am running toward a tomorrow that may or may not exist(Perhaps both possibilities exist at once in two parallel worlds), even though sometimes I forget that. I have the fear of death that comes with realizing that perhaps only three quarters of a life remain, and yet I am strangely at peace with the possibility of a death that could arrive tomorrow.
  
  I am not a normal person.
  
  But I have made peace with the abnormal person that I am.
  
  I am the thorn bird and the blue giant.
  
  There is, in truth, nothing particularly admirable about my brightness or my heat.
