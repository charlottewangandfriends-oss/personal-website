title: On Passion
category: prose-blog
language: en
date: '2026-05-15'
body: |-
  Recently, I finally feel like I have more or less figured out my relationship with passion.
  
  Passion is a word without direct Chinese translation, and thus completely absent as a concept in my early years. I remember when I first applied to American high schools and encountered the question “What is your passion?” for the first time, I was completely lost. Back then, my understanding of it was shallowly stuck at “something I do that I like” So I wrote, roughly, that I liked literature, music, theater, and Model UN (lol. Although I do think the social sciences are interesting, they are probably nowhere near my passion).
  
  For a long stretch of my life, there was no room for passion. But many years later, I realized that it had actually been sleeping in my soul all along. When my life was framed by an enormous cage, passion still seeped out through my limited agency. And before I could feel it myself, some others had noticed I t, and was willing to protect it and encourage it. I also still remember the sensation of trembling all over when I read The Sorrows of Young Werther. At that time, I could sense that I was a Romantic who did not fit into the world, but I still did not know that this sincerity, this burning intensity, this moth-to-flame kind of devotion, was passion.
  
  During my days at Amherst, my passion became an unbridled wild horse, no longer restrained. I could study anything I wanted to study. I could be obsessed; I could burn; I could just go ahead and be myself. My professors would steadily catch that passion and draw it out even further; my friends would appreciate it and embrace it. It was also a world full of room for mistakes, almost free of consequences. I could charge forward without ending up bloodied; I could indulge myself and take it for granted that I was allowed to be myself.
  
  When I went to conservatory, I did feel my passion become contained again. My inner drive was replaced by intense external motivation, and the pressure of adapting to society and to the professional world gradually pushed me back into the mode of learning how other people behave (which is not a bad thing). Over the past year, I once again began working hard to meet a certain standard or expectation. Compared with the earliest days, when this felt habitual and natural, after several years of freedom, I found it much harder this time. In spite of my adaption to the adult world, part of me was still lost.
  
  But when I returned to my alma mater this time, my passion instinctively revived again over this land. Yet the change in my identity also meant that I began running into walls, as I was no longer the novice protected by that amulet. I realized that even in a place that resembles an ivory tower, social expectations are still everywhere. Suddenly I understood that this kind of reckless passion is like fire: it can break through layers of worldly obstacles and create miracles, but it can also pierce through other people’s personal space and boundaries, bringing pressure and creating tension. People often told me “it is wonderful that you care”, but they mostly won’t tell me I care too much, even when they feel so.
  
  When David and I were unpacking what had happened recently, he said, “yeah Sometimes you really are so enthusiastic that it makes it hard for people to say no.” I sighed and said, “This may sound strange, but I feel like the reason our marriage works so well is because I don’t have passion for you.” He said, “Eh well, that sounds kind of true. Isn’t that a good thing though?”
  
  (It is a good thing, because passion creates tension, and a tension-free environment is perhaps the best model of home for people like us. And David is a being without passion. When I was being tortured by the pressure of applying to music schools, he (while constantly supporting whatever I decided) looked at me with innocent and ingeniously curious eyes and asked why, with other two majors , I insisted on walking down one path that doesn’t look pleasant. But over the years, he has always respected me, slowly tried to learn and understand my spiritual and emotional world, and tolerated and supported all of my passions, whether they were directed toward abstract things or specific people and places.)
  
  I probably cannot live without passion in this lifetime. It is precisely because I can release my passion that I have all the potential I have; without it, I would no longer be truly myself. But only someone who can control passion, someone who can live with it, can be said to truly possess it. Goethe, once burned by passion, did not walk toward destruction like the Werther he created. Yet when he wrote that story years later, he still looked upon the shadow of his younger self with tenderness and acceptance. And after many long years, he became the Goethe who wrote Faust: waking up on a spring morning, finding redemption through repentance, and then moving forward.
  
  “Babe you’re starting to understand the world now. I am so proud of you,” said David after listening to my long string of reflections. “I mean it genuinely. I said it with a straight face.”
  
