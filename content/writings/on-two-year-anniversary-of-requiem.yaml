title: On Two-Year Anniversary of Requiem
category: prose-blog
language: en
date: '2026-02-03'
body: |-
  Two years ago, my senior composition thesis Requiem: Ceaseless Life was premiered in Buckley Hall at Amherst, performed by 41 volunteer musicians with me on the podium. As the culmination of my undergraduate years, it remains one of the most defining moments of my time at Amherst: something I still return to, again and again. 
  
  For a long while, it felt like a Mount Everest I could never climb again. This year does feel different. I just returned from a trip to Amherst, where I attended two senior thesis concerts and had long conversations with my former thesis advisor, Prof. Sawyer.
  
  In the past two years, I have outgrown myself in conducting quickly, as preparing for auditions forced me to progress fast. And now, as a more grounded choral conductor, I can clearly see how many things I would do differently. There are details—technical, musical, narrative—that I simply didn’t yet have the awareness or skills to address back then (and honestly, even with hindsight, probably not enough time anyway). I do consider bringing in one or two movements when I work on my later MM UChoir projects.
  
  Composition-wise, the aftermath was harder. After the premiere, I ran straight into a wall. The Requiem felt like a summit I could never reach again. I wrote only one art song in the entire year following it, and it was only happening because of the seminar requirements. I slowly resumed composing last June, still searching for my language. It wasn’t until mid-semester breaks at UM that things truly began to move again, when I found a new flow, a new role, and a new philosophy of composing outside a seminar course framework. I don’t know when I’ll have the time or opportunity to start another large-scale work. But I do know I’m ready again.
  
  Looking back now, I realize that while the Requiem once felt nearly perfect to me, I’m no longer fully satisfied with certain movements. There are places where I’d rethink the orchestration, or even text setting. During the thesis crunch, there were times when I was simply trying to get to the finish line. I hope that one day it might lead to publication, and with that, the chance to polish, revise, and even rework parts of it.
  
  Still, the work lives in my memory as something deeply dear: a celebration of my Amherst years; an anticipation of death and rebirth. I lived through the Requiem’s journey once while writing it, and I ended up living through it for real with my small death farewelling Amherst through grief, heartache, tears, and eventual resolution.
  
  And above all, I am endlessly grateful forever to the musicians who brought it to life. It was an immense privilege to gather such a large group of people around this project. They are now scattered across the world, but in certain eternal folds of time, we are still together, sharing the moment of intimacy, vulnerability, and connection through music. When I went back last weekend, I saw very new groups while some legacy in the thesis of my young successors (though Bella inherited my baritone soloist and two chorus singers, and John inherited my viola principal and two cellists). I saw unique musical expression on the same stage and same thesis procedure. I feel the echoes of the same spirit carried forward in the theses of younger musicians—new constellations forming from familiar stars.
  
  Just as the deceased (soloist) reaches the eventual peace after her own spiritual journey, embracing rather than resigning to her ultimate fate of perishing:
  
  “You will tread where I once roamed,
  and harmonize a voice in my echo.
  Our stories, divergent yet akin—
  am I not you, are you not me?”
  
  Yet I can’t describe my relationship with this piece as simply “moving on.” There is something far more personal than that. I’ve always said I want movements 7–8 played at my funeral, and the full Requiem at my memorial—I do mean it. Ideally with some of the original premiere musicians, if they outlive me.
  The only real question now is whether I’ll be adding more pieces to my funeral playlist (as I continue living & composing)🌚
