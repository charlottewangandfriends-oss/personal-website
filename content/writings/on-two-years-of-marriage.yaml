title: On Two Years of Marriage
category: prose-blog
language: en
date: '2026-07-03'
body: |-
  Today marks two years since David and I became legal spouses. In the summer of 2024, we were both freshly out of college, standing before the wide-open landscape of life. We were unsure about what the future held, yet we decided to hold each other closely regardless of the unknowns. Without proposal or wedding, we formed a union against the tides of fate. Over these past two years, we’ve guarded each other across distance and bridged each other’s (fragmented) pasts and futures.
  
  I can’t express enough gratitude for David. He gave me a home amid uncertainty—a place I had once only dreamed of and longed for. Because of him, I feel brave enough to venture deeper into the jungle of my own ambitions and passions, knowing that someone will always have my back. As I’ve been more put together in the past few years, I’m aware that I was able to bring some good things to people around, yet only David bore with (more various and numerous) bad things of me. I know I can be difficult and hard to deal with, and sometimes I still wonder whether I know how to be a good wife, but he has never stopped believing in me. 
  
  This marriage was not the Hegelian bond I once envisioned at 18, and an older version of me may not want to get married for a long while, yet there he is. It amazes me how naturally everything has unfolded. The whole journey has been, in the truest sense, both beautiful and sublime, and I’m looking forward to more. Nice to have met you David, and I love you.
