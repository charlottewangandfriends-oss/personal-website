title: On My Piano Journey
category: prose-blog
language: en
date: '2025-10-25'
body: |-
  Tonight’s “Emperor” concerto by the Philharmonia was phenomenal, but what especially moved me was the Bach organ sonata Ólafsson played as the encore. A beautiful reinterpretation with the piano’s particularly intimate color — it reminded me of why and how I first loved the piano.
  
  I realize I haven’t talked much about piano in recent years. Piano is literally my first instrument — I often say I’ve sung in choir my whole life, but piano even came before that. My parents still mention how, as a kid, I heard the sound of the piano and immediately wanted to learn it. The random-brand upright at my parents’ place was my fifth birthday gift after I’d already been playing for a while — so it’s been twenty years now.
  
  I probably had more unpleasant memories with piano than with any other instrument. I started with a bad teacher, who left me with many bad habits. Thankfully, after hitting a plateau around age eight, my parents found connections to get me a better teacher. But the experience after that wasn’t much better — I learned piano like many other Asian kids did. My mother (who didn’t know music) would sit beside me with hangers (mostly plastic, sometimes metal) in her hand, making sure I sat through long practice hours. ADHD wasn’t a thing in China back then. During summers in elementary school, I practiced six to eight hours a day for weeks, preparing for amateur piano exams. I only started to enjoy piano in middle school, when I was advanced enough to play Chopin etudes — and when my academic stress grew enough that I was no longer expected to spend hours at the keyboard. I was told that’s how things work — that you don’t get to enjoy something until you’ve spent enough time and tears on it. I only learned years later that it didn’t always have to be that way.
  
  Many of my classmates (who were much more advanced than me at the time) quit after middle school. I think I was lucky — I was chosen as the accompanist for our choir in eighth grade, and that kept me with the instrument.
  
  My early years with piano had no meaning, while my teen years were largely wasted. I decided to pursue music rather late, and before that, people always told me my piano was already “good enough,” that I shouldn’t invest more time. Living in Tennessee reinforced that illusion — I was the best pianist in my high school, perhaps far more advanced than most peers around me. I was always the one called to play for musical events, where the music was often simple and sight-readable. It wasn’t until I arrived at Amherst that I realized how much bigger the sky truly was — but by then, I was already in my twenties.
  
  It was also hard to decide to pick up piano again, because doing so meant confronting my past. My college orchestral conducting teacher, Mark, helped me make that decision. He once told me how he had been a concerto player in high school but only did easy musical theater music in college; when he went back to music school around 28, he was already too old to make big technical progress. His “do it before you’re too old” advice hit me and really stayed with me.
  
  The beginning of returning to serious practice was a struggle — physically and mentally. I had to rebuild a lot of technique from scratch. Facing my past brought up a lot of grievance, especially when I saw peers (or even underclassmen) who had started piano later than me but had grown so much further. Seeing myself as a pianist meant holding myself to the same standard, constantly reminded of all the detours I had taken and the time I had lost.
  
  My re-pickup of piano started with collaborative projects — accompanying two concert pianists on concerto movements for masterclasses (I ended up conducting one and playing timpani for the other). A pianist friend once told me he loved the piano because “you can play everything on it.” My technique may never allow that, but through serious chamber music (fun fact — it was always duets) and composition seminar premieres, I gradually discovered the other magic of the piano — its ability to collaborate with every instrument.
  
  I think I finally found peace with piano recently, thanks to some exceptional guidance. I’ve started to embrace practice as a natural part of my life again. And sometimes I realize — quietly, almost imperceptibly — that I’m regaining control over the instrument: grabbing chords with ease, shaping layers, finding colors again.
  
  I’m deeply grateful for my piano teachers in recent years — Dr. Fukuda at Amherst College, who rebuilt my technique, taught me how to practice, and pushed me to start truly listening as I play; and Prof. Otamendi at UM, who generously welcomed me into her studio and projects, guiding me with extraordinary patience and empathy while never compromising her high standard.
  
  Looking back, I know I’ve lost time — years that could have been spent differently (though I know it’s impossible without all the hindsight), and things I’ll never quite catch up to. I didn’t know much about concertos when I was young; by the time I realized how extraordinary they were, it was already too late. I’ll never be a concert pianist, and that’s ok.
  
  I’ve found MY way to live with the piano — to grow alongside it rather than chase after what’s gone. Its meaning changes as I do. What began with resistance has turned into understanding; what once felt like an absence now feels like room to breathe.
  
  Maybe that’s what the Bach encore reminded me — There’s still so much beauty left to discover, so much magic to explore. And maybe that’s enough… to keep listening, to keep learning, to keep finding new ways to stay with music.
