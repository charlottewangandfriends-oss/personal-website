title: On Farewell to Percussion
category: prose-blog
language: en
date: '2026-05-06'
body: |-
  Some goodbyes are quiet, and sometimes you do not even know whether they can be called goodbyes at all. Yet still I decided to write something.
  
  This thread of thought began with a recent conversation had with Kai. I had been called in at the last minute to play some snare for choir. I had not touched a mallet in a whole year; my wrist was full of tension, and I was sweating on stage throughout the entire song. I told Kai this, and he said, “Actually, I also haven’t touched a stick for a whole year.”
  
  It is hard to explain how something clicked in that moment — that sudden feeling that you have grasped some essence, and everything becomes real. It was like those supernatural stories in which a ghost suddenly realizes they have been dead for a long time.
  
  Maybe I should not phrase it as “I am no longer a percussionist.” But I do have to admit that this part of my identity has slowly crept away from me. And I think the situation for a classical percussionist is rather either-or: if, by a certain point, you are not advanced enough to gig regularly, then you are not very different from musicians who are drafted once in a lifetime to cover a percussion part.
  
  As a secondary instrument, percussion is so much harder to keep as an amateur than viola.
  
  My entire journey with percussion has been filled with the flavor of fate. I started percussion completely unexpectedly. In my senior year of high school, I had one extra free academic block, and I planned to join the string orchestra as a pianist, but it happened to conflict with choir. So I joined band instead, as a percussionist, because they needed someone who could sight-read pitches and handle mallet parts. There, I received my first lessons in a group setting and learned the basic techniques. The bar was low, so I was not sure how far I had actually gone. I only remember that right before Covid shut everything down, my band went on tour, and some university whose name I can no longer remember said they could offer scholarships if I went there to play percussion.
  
  Then Covid hit, and I did not touch percussion for an entire year. My first semester of college was remote, from China, and I had to keep a flipped sleep schedule. I could not really practice much piano, let alone percussion. In the spring, I eventually came to campus, but of course there were no normal rehearsals during that high-Covid year; all I could do was some solo marimba. In my sophomore year, rehearsals finally resumed. Admittedly, I probably entered Amherst in the worst possible year for a percussionist. After many years of almost no percussionists, the section was suddenly fully staffed. There were three people literally one year above me, and another exceptionally good percussionist in my own year, while I had zero orchestral experience before college (playing in band is quite different, at least in my opinion). Naturally, I was placed very far back on the priority list. Besides, for a long time, Amherst did not have a percussion teacher (though I probably would not have thought about taking lessons then anyway, because the limited playing opportunities made it feel not quite worthwhile); Access to percussion practice was not really systematized until after I graduated. As a result of all these coincidences, my physical percussion technique more or less stayed in the same place for four years.
  
  On the other hand, percussion has formed a crucial part of my not-so-long musical life so far. Despite back in the priority list, I still had significantly more percussion parts than piano. And I do believe that the largest part of being an ensemble percussionist is ensemble experience — and that, I fortunately did receive in a full and vivid way. In the beginning, when I was in band, I first learned how to read part (in choir, people see each other’s part), how to move between different percussion instruments, how to enjoy the measures of rest while watching the wind players blow so hard, and how to share myself among multiple parts while — for other instruments, multiple people might share the same part. In my early orchestral life, I learned to stay in control in extremely exposed situations, with confidence and precision (many years later, Mark would still remember that Charlotte, in her first year in orchestra, crashed the cymbals four measures early in the climax of the finale of Mahler 1). I learned to live beyond the part and situate my role within the whole musical picture, because otherwise you are killed by counting. I learned how to manage understaffed situations, and how to set up and strike the stage (which is, in its own way, a lot of cardio).
  
  Many orchestral experiences are unique to percussionists. Sometimes I sat through an entire concert, or was called for a full rehearsal, for three triangle hits. Sometimes I rescued nearby flutists from collapsing suspended cymbals. Sometimes I anticipated and protected myself from a fellow percussionist’s fff bass drum hit. Later in my Amherst years, I learned to look at the full score from the percussion section, and even to play from the full score (I remember playing tam-tam and cymbals in Mahler 5 from the full score throughout, until the dense cymbal section near the end). Sometimes, on a crowded stage, I had to go underneath the xylophone just so I could reach the vibraphone in time (yes I’m talking about you Gershwin).
  
  After I graduated, Amherst eventually got a good percussion teacher, an official percussion ensemble, and a more regular system for percussion access, all of which I did get to benefit from a little as a GA. It did feel as though all of this came too late for me…But alas, perhaps it would not have made that much difference, since I was fifth on the priority list anyway.
  
  “I haven’t touched the stick for a year” was sad and real. Percussionists are just a role so tied to ensembles, and practice is so limited to institutional access (I don’t think I have any access to percussions at UM, lol). While I can play some viola for amusement, it just can’t happen to percussion (I don’t think I’d have any joy practicing on a mediocre pad, though I did build my mallet bag at last Black Friday, LOL)
  
  On last Sunday, I got to watch the concert of the current Amherst percussion ensemble. They redid a chamber piece we performed last year, with Kidane taking the part that had previously been Kai’s (I put the clips side by side at the end). O Kidane — once the noticeably little one in our section — is now the oldest leader, truly transformed into an Adultane. Now the percussionists are well resourced, perhaps with a five-octave marimba finally on the way, and I am happy for them. Among all the illusions of belonging I felt during my Amherst visit, I also felt the one clear no-longer-belonging to the percussion section. I am watching them thrive from a distance.
  
  So perhaps this is a conclusion, though nothing is really concluded. I am quietly slipping away from the percussion life and the percussion tag, like drifting away from an old friend. Yet the experience has become part of me forever. I guess I shouldn’t ask for too much for secondaries… most people don’t get to continue their high school instrument in adulthood anyway. I am always happy to play some firefighter role in a percussion understaffing crisis, if only to give myself an excuse to practice a little again.
