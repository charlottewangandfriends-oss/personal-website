title: Orpheus Singers — Mortal Flesh, Eternal Light
date: 2026-10-11
time: 7:00 PM – 9:00 PM
timezone: America/Detroit
venue: Stamps Auditorium
location: Ann Arbor, Michigan
description: >-
  Charlotte co-conducts Joseph Martin Kraus’s Requiem in D minor with Sophie
  Choate, performed by Orpheus Singers and the University of Michigan Baroque
  Chamber Orchestra. Soloists for Charlotte’s portion are Kya Leeson, soprano,
  and Haley Hunt, alto. Charlotte also sings Soprano II in the solo ensembles
  of Ad manus, Ad latus, and Ad faciem from Buxtehude’s Membra Jesu Nostri,
  including the trio in Ad faciem.
